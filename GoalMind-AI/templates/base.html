<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoalMind AI — Dashboard</title>
  <link rel="icon" href="data:,">

  <!-- Estilo general de la app -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

  <!-- Dashboard CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

  <!-- Estilos Mission Control para paneles de estadisticas -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/stats_theme.css') }}">
</head>
<body class="page-{{ page|default('dashboard') }}">
  <div class="app">
    {% include "partials/left_panel.html" %}
    <main>
      {% block content %}{% endblock %}
      {% include "partials/footer.html" %}
    </main>
  </div>

  <!-- AI Chat Overlay -->
  {% include "partials/magicbox_templates/ai_chat.html" %}

  <div class="confirm-modal" id="confirmModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
    <div class="confirm-modal-overlay" data-action="cancel"></div>
    <div class="confirm-modal-content" role="document">
      <div class="confirm-modal-header">
        <h3 class="confirm-modal-title" id="confirmModalTitle">&iquest;Confirmar?</h3>
        <button type="button" class="confirm-modal-close" data-action="close" aria-label="Cerrar">&times;</button>
      </div>
      <div class="confirm-modal-body" id="confirmModalBody"></div>
      <div class="confirm-modal-actions">
        <button type="button" class="panel-action-btn secondary" data-action="cancel">Cancelar</button>
        <button type="button" class="panel-action-btn danger" data-action="confirm">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Chart.js OFFLINE -->
  <script src="{{ url_for('static', filename='js/chart.umd.js') }}"></script>

  <!-- Script general de la app -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>

  <!-- Confirmation Modal Script -->
  <script src="{{ url_for('static', filename='js/confirm_modal.js') }}"></script>

  <!-- AI Chat Script -->
  <script src="{{ url_for('static', filename='js/ai_chat.js') }}"></script>
</body>
</html>
