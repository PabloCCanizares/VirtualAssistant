{% extends "base.html" %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">

<section class="mission-shell">
  {% include "partials/header.html" %}

  <div class="mission-heading">
    <h1 class="mission-title">Mission Control</h1>
    <p class="mission-subtitle">Resumen ejecutivo del asistente personal · estado operativo en tiempo real</p>

  <div class="mission-grid">

      {% include "partials/right_panel.html" %}
    </aside>
  </div>

<script src="{{ url_for('static', filename='js/calendar.js') }}" type="module"></script>
<script src="{{ url_for('static', filename='js/dashboard_stats.js') }}"></script>
