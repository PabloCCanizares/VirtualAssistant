{% extends "base.html" %}

{% block content %}
<section class="gm-dashboard-shell" aria-label="Dashboard GoalMind AI">
  <header class="gm-command-topbar" aria-label="Barra de dashboard">
    <div class="gm-topbar-left">
      <h2>Dashboard</h2>
      <span class="gm-topbar-chevron" aria-hidden="true">&rsaquo;</span>
      <a class="gm-icon-action gm-icon-action-compact" href="{{ url_for('dashboard_bp.dashboard') }}" aria-label="Volver al dashboard" title="Volver">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <span class="gm-topbar-date">{{ dashboard.today_label }}</span>
      <a class="gm-icon-action gm-icon-action-compact" href="{{ url_for('calendar_bp.calendar_page') }}" aria-label="Abrir agenda" title="Abrir agenda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      </a>
    </div>

    <nav class="gm-dashboard-actions" aria-label="Acciones del dashboard">
      <label class="gm-dashboard-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
        <input type="search" placeholder="Buscar..." aria-label="Buscar">
        <span>Ctrl K</span>
      </label>
      <a class="gm-icon-action" href="{{ url_for('project_bp.list_projects') }}" aria-label="Nuevo proyecto" title="Nuevo proyecto">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </a>
      <a class="gm-icon-action" href="{{ url_for('task_bp.list_tasks_by_user') }}" aria-label="Tareas" title="Tareas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 2 2 4-4M4 17l2 2 4-4M13 8h7M13 18h7"/></svg>
      </a>
      <a class="gm-icon-action" href="{{ url_for('task_bp.list_tasks_by_user') }}" aria-label="Avisos" title="Avisos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
      </a>
      <a class="gm-icon-action" href="{{ url_for('dashboard_bp.config') }}" aria-label="Configuracion" title="Configuracion">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6.7 6.7 0 0 0 8.7 8.7 8 8 0 1 1-8.7-8.7Z"/></svg>
      </a>
    </nav>
  </header>

  {% if dashboard.load_error %}
    <div class="gm-dashboard-alert">No se pudieron cargar todos los datos: {{ dashboard.load_error }}</div>
  {% endif %}

  {% include "partials/dashboard_templates/dashboard_home_panel.html" %}
</section>

<script src="{{ url_for('static', filename='js/calendar.js') }}" type="module"></script>
<script src="{{ url_for('static', filename='js/dashboard_briefing.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard_stats.js') }}"></script>
{% endblock %}
