{% extends "base.html" %}

{% block content %}
<section class="gm-dashboard-shell gm-weekly-meeting-shell" aria-label="Reunion semanal con el agente">
  <header class="gm-command-topbar" aria-label="Barra de reunion semanal">
    <div class="gm-topbar-left">
      <h2>Reunion semanal</h2>
      <span class="gm-topbar-chevron" aria-hidden="true">&rsaquo;</span>
      <a class="gm-icon-action gm-icon-action-compact" href="{{ url_for('dashboard_bp.dashboard') }}" aria-label="Volver al dashboard" title="Volver">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <span class="gm-topbar-date">{{ dashboard.today_label }}</span>
      <a class="gm-icon-action gm-icon-action-compact" href="{{ url_for('calendar_bp.calendar_page') }}" aria-label="Abrir agenda" title="Abrir agenda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      </a>
    </div>

    <nav class="gm-dashboard-actions" aria-label="Acciones de reunion semanal">
      <a class="gm-icon-action" href="{{ url_for('dashboard_bp.dashboard') }}" aria-label="Dashboard" title="Dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </a>
      <a class="gm-icon-action" href="{{ url_for('calendar_bp.calendar_page') }}" aria-label="Agenda" title="Agenda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      </a>
      <a class="gm-icon-action" href="{{ url_for('task_bp.list_tasks_by_user') }}" aria-label="Tareas" title="Tareas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 2 2 4-4M4 17l2 2 4-4M13 8h7M13 18h7"/></svg>
      </a>
      <a class="gm-icon-action" href="{{ url_for('dashboard_bp.config') }}" aria-label="Configuracion" title="Configuracion">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.8 1.8 0 0 0 15 19.4a1.8 1.8 0 0 0-1 .6 1.8 1.8 0 0 0-.5 1.27V21a2 2 0 1 1-4 0v-.08A1.8 1.8 0 0 0 8 19.4a1.8 1.8 0 0 0-1.98.36l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.8 1.8 0 0 0 4.6 15a1.8 1.8 0 0 0-.6-1 1.8 1.8 0 0 0-1.27-.5H3a2 2 0 1 1 0-4h.08A1.8 1.8 0 0 0 4.6 8a1.8 1.8 0 0 0-.36-1.98l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.8 1.8 0 0 0 9 4.6a1.8 1.8 0 0 0 1-.6 1.8 1.8 0 0 0 .5-1.27V3a2 2 0 1 1 4 0v.08A1.8 1.8 0 0 0 16 4.6a1.8 1.8 0 0 0 1.98-.36l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.8 1.8 0 0 0 19.4 9c.12.36.33.7.6 1 .36.33.8.5 1.27.5H21a2 2 0 1 1 0 4h-.08A1.8 1.8 0 0 0 19.4 15Z"/></svg>
      </a>
    </nav>
  </header>

  {% if dashboard.load_error %}
    <div class="gm-dashboard-alert">No se pudieron cargar todos los datos: {{ dashboard.load_error }}</div>
  {% endif %}

  <div class="gm-weekly-meeting-window">
    {% include "partials/dashboard_templates/weekly_meeting_panel.html" %}
  </div>
</section>

<script src="{{ url_for('static', filename='js/weekly_meeting.js') }}"></script>
{% endblock %}
