<aside class="side-panel">

  <div class="side-panel-card">
    <div class="side-panel-header">
      <span class="side-panel-icon">➕</span>
      <h3 class="side-panel-title">Nuevo proyecto</h3>
    </div>

    <form method="post"
          action="{{ url_for('project_bp.add_project') }}"
          class="panel-form">

      <div class="panel-form-group">
        <label class="panel-form-label" for="titulo">Titulo</label>
        <input type="text"
               name="titulo"
               id="titulo"
               class="panel-form-input"
               placeholder="Investigación IA aplicada"
               required>
      </div>

      <div class="panel-form-group">
        <label class="panel-form-label" for="descripcion">Descripcion</label>
        <textarea name="descripcion"
                  id="descripcion"
                  class="panel-form-textarea"
                  rows="3"
                  placeholder="Resumen y alcance del proyecto"></textarea>
      </div>

      <div class="panel-form-row">
        <div class="panel-form-group">
          <label class="panel-form-label" for="fecha_inicio">Fecha inicio</label>
          <input type="date"
                 name="fecha_inicio"
                 id="fecha_inicio"
                 class="panel-form-input">
        </div>
        <div class="panel-form-group">
          <label class="panel-form-label" for="fecha_fin">Fecha fin</label>
          <input type="date"
                 name="fecha_fin"
                 id="fecha_fin"
                 class="panel-form-input">
        </div>
      </div>

      <div class="panel-form-row">
        <div class="panel-form-group">
          <label class="panel-form-label" for="categoria">Categoria</label>
          <select name="categoria" id="categoria" class="panel-form-select">
            <option value="Investigacion" selected>Investigacion</option>
            <option value="Trabajo">Trabajo</option>
            <option value="Personal">Personal</option>
            <option value="Estudios">Estudios</option>
            <option value="Otros">Otros</option>
          </select>
        </div>
        <div class="panel-form-group">
          <label class="panel-form-label" for="prioridad">Prioridad</label>
          <select name="prioridad" id="prioridad" class="panel-form-select">
            <option value="Baja">Baja</option>
            <option value="Media" selected>Media</option>
            <option value="Alta">Alta</option>
          </select>
        </div>
      </div>

      <div class="panel-form-row">
        <div class="panel-form-group">
          <label class="panel-form-label" for="estado">Estado</label>
          <select name="estado" id="estado" class="panel-form-select">
            <option value="Activo" selected>Activo</option>
            <option value="En pausa">En pausa</option>
            <option value="Completado">Completado</option>
          </select>
        </div>
        <div class="panel-form-group">
          <label class="panel-form-label" for="id_usuario">ID Usuario</label>
          <input type="text"
                 name="id_usuario"
                 id="id_usuario"
                 class="panel-form-input"
                 placeholder="opcional">
        </div>
      </div>

      <button type="submit" class="panel-form-submit">Crear proyecto ✨</button>
    </form>
  </div>

  <div class="side-panel-card">
    <div class="side-panel-header">
      <span class="side-panel-icon">💡</span>
      <h3 class="side-panel-title">Consejos</h3>
    </div>
    <div class="ai-suggestion-item">
      <strong>Define alcance</strong>
      <p>Un proyecto claro facilita priorizar objetivos y evitar tareas sueltas.</p>
    </div>
    <div class="ai-suggestion-item">
      <strong>Adjunta contexto</strong>
      <p>Sube documentos clave para centralizar la información.</p>
    </div>
  </div>

</aside>
