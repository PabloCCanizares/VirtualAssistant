<div class="ai-chat-overlay" id="ai-chat-overlay">
  <div class="ai-chat-container">
    <!-- Boton cerrar -->
    <button type="button" class="ai-chat-close" id="ai-chat-close" aria-label="Cerrar">
      <span>&times;</span>
    </button>

    <!-- Area de conversacion -->
    <div class="ai-chat-messages" id="ai-chat-messages">
      <div class="ai-chat-welcome">
        <h2>GoalMind AI</h2>
        <p>Pregunta lo que necesites sobre tus objetivos, tareas o planificacion.</p>
      </div>
    </div>

    <!-- Barra de entrada -->
    <div class="ai-chat-input-wrapper">
      <div class="ai-chat-input-container">
        <textarea
          class="ai-chat-input"
          id="ai-chat-input"
          placeholder="Escribe tu mensaje..."
          rows="1"
        ></textarea>
        <div class="ai-chat-input-actions">
          <button type="button" class="ai-chat-btn" id="ai-chat-attach" aria-label="Adjuntar archivo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <button type="button" class="ai-chat-btn" id="ai-chat-voice" aria-label="Entrada de voz">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
          <button type="button" class="ai-chat-btn ai-chat-btn-send" id="ai-chat-send" aria-label="Enviar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>
      <input type="file" id="ai-chat-file-input" class="ai-chat-file-input" multiple hidden>
    </div>
  </div>
</div>
