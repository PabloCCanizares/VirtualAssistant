<div class="ai-chat-overlay" id="ai-chat-overlay">
  <div class="ai-chat-container">
    <!-- Boton cerrar -->
    <button type="button" class="ai-chat-close" id="ai-chat-close" aria-label="Cerrar">
      <span>&times;</span>
    </button>

    <!-- Area de conversacion -->
    <div class="ai-chat-messages" id="ai-chat-messages">
      <div class="ai-chat-welcome">
        <h2>GoalMind AI</h2>
        <div class="ai-chat-welcome-actions">
          <button type="button" class="ai-chat-welcome-btn" data-prompt="Preguntame lo que quieras">
            1. Preguntame lo que quieras
          </button>
          <button type="button" class="ai-chat-welcome-btn" data-prompt="Dame recomendaciones personales">
            2. Recomendaciones personales
          </button>
          <button type="button" class="ai-chat-welcome-btn" data-prompt="Hazme un resumen de la semana">
            3. Resumen de la semana
          </button>
        </div>
      </div>
    </div>

    <!-- Barra de entrada -->
    <div class="ai-chat-input-wrapper">
      <div class="ai-chat-controls">
        <label for="ai-chat-model" class="ai-chat-controls-label">Modelo</label>
        <select id="ai-chat-model" class="ai-chat-controls-select" aria-label="Modelo de IA"></select>
        <label for="ai-chat-deep-search-mode" class="ai-chat-controls-label">Busqueda profunda</label>
        <select id="ai-chat-deep-search-mode" class="ai-chat-controls-select">
          <option value="auto">Auto</option>
          <option value="on">On</option>
          <option value="off">Off</option>
        </select>
      </div>
      <div class="ai-chat-input-container">
        <textarea
          class="ai-chat-input"
          id="ai-chat-input"
          placeholder="Escribe tu mensaje..."
          rows="1"
        ></textarea>
        <div class="ai-chat-input-actions">
          <button type="button" class="ai-chat-btn ai-chat-btn-send" id="ai-chat-send" aria-label="Enviar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>
      <input type="file" id="ai-chat-file-input" class="ai-chat-file-input" multiple hidden>
    </div>
  </div>
</div>
