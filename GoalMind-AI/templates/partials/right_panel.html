<div class="dashboard-side" id="dashboardSide">

  <!-- Crear proyecto -->
  <section class="dashboard-card" data-card="project-form">
    <div class="dashboard-card-header">
      <span class="dashboard-card-icon"></span>
      <h2 class="dashboard-card-title">Crear proyecto</h2>
      <span class="dashboard-card-toggle">▼</span>
    </div>
    <div class="dashboard-card-content">
      <form id="quickProjectForm" class="dashboard-form">
        <div class="dashboard-form-group">
          <label class="dashboard-form-label" for="project_title">Proyecto</label>
          <input id="project_title"
                 name="title"
                 class="dashboard-form-input"
                 placeholder="Nombre del proyecto"
                 required>
        </div>

        <div class="dashboard-form-row">
          <div class="dashboard-form-group">
            <label class="dashboard-form-label" for="project_category">Categoria</label>
            <input id="project_category"
                   name="category"
                   class="dashboard-form-input"
                   placeholder="p. ej., Investigacion">
          </div>
          <div class="dashboard-form-group">
            <label class="dashboard-form-label" for="project_priority">Prioridad</label>
            <select id="project_priority" name="priority" class="dashboard-form-select">
              <option value="low">Baja</option>
              <option value="medium" selected>Media</option>
              <option value="high">Alta</option>
            </select>
          </div>
        </div>

        <div class="dashboard-form-row">
          <div class="dashboard-form-group">
            <label class="dashboard-form-label" for="project_status">Estado</label>
            <select id="project_status" name="status" class="dashboard-form-select">
              <option value="active" selected>Activo</option>
              <option value="paused">En pausa</option>
              <option value="done">Completado</option>
            </select>
          </div>
          <div class="dashboard-form-group">
            <label class="dashboard-form-label" for="project_deadline">Fecha limite</label>
            <input id="project_deadline"
                   name="deadline"
                   type="date"
                   class="dashboard-form-input">
          </div>
        </div>

        <div class="dashboard-form-group">
          <label class="dashboard-form-label" for="project_desc">Descripcion</label>
          <textarea id="project_desc"
                    name="description"
                    class="dashboard-form-textarea"
                    rows="2"
                    placeholder="Resumen del proyecto..."></textarea>
        </div>

        <button type="submit" class="dashboard-form-submit">Guardar proyecto</button>
      </form>
      <p id="projectMessage" class="muted" style="margin-top:8px;font-size:12px;"></p>
      <ul id="projectList" class="muted" style="margin-top:10px;font-size:12px;"></ul>
    </div>
  </section>

  <!-- Crear tarea -->
  <section class="dashboard-card" data-card="task-form">
    <div class="dashboard-card-header">
      <span class="dashboard-card-icon"></span>
      <h2 class="dashboard-card-title">Crear tarea</h2>
      <span class="dashboard-card-toggle">▼</span>
    </div>
    <div class="dashboard-card-content">
      <form id="quickTaskForm" class="dashboard-form">
        <div class="dashboard-form-group">
          <label class="dashboard-form-label" for="task_title">Titulo de la tarea</label>
          <input id="task_title"
                 name="title"
                 class="dashboard-form-input"
                 placeholder="p. ej., Revision bibliografica"
                 required>
        </div>

        <div class="dashboard-form-row">
          <div class="dashboard-form-group">
            <label class="dashboard-form-label" for="task_goal">Objetivo asociado</label>
            <input id="task_goal"
                   name="goal"
                   class="dashboard-form-input"
                   placeholder="Objetivo del proyecto">
          </div>
          <div class="dashboard-form-group">
            <label class="dashboard-form-label" for="task_project">Proyecto</label>
            <input id="task_project"
                   name="project"
                   class="dashboard-form-input"
                   placeholder="Proyecto relacionado">
          </div>
        </div>

        <div class="dashboard-form-row">
          <div class="dashboard-form-group">
            <label class="dashboard-form-label" for="task_status">Estado</label>
            <select id="task_status" name="status" class="dashboard-form-select">
              <option value="pending">Pendiente</option>
              <option value="in_progress">En curso</option>
              <option value="done">Completada</option>
            </select>
          </div>
          <div class="dashboard-form-group">
            <label class="dashboard-form-label" for="task_due">Vencimiento</label>
            <input id="task_due"
                   name="due"
                   type="datetime-local"
                   class="dashboard-form-input">
          </div>
        </div>

        <button type="submit" class="dashboard-form-submit">Guardar tarea</button>
      </form>
      <p id="taskMessage" class="muted" style="margin-top:8px;font-size:12px;"></p>
      <ul id="taskList" class="muted" style="margin-top:10px;font-size:12px;"></ul>
    </div>
  </section>

  <!-- Gestionar categorias -->
  <section class="dashboard-card" data-card="category-form">
    <div class="dashboard-card-header">
      <span class="dashboard-card-icon"></span>
      <h2 class="dashboard-card-title">Gestionar categorias</h2>
      <span class="dashboard-card-toggle">▼</span>
    </div>
    <div class="dashboard-card-content">
      <!-- Buscador de categorias -->
      <div class="dashboard-form-group">
        <label class="dashboard-form-label" for="category_search">Buscar categoria</label>
        <input id="category_search"
               type="text"
               class="dashboard-form-input"
               placeholder="Escribe para buscar...">
      </div>

      <!-- Lista de categorias -->
      <div class="category-list-container">
        <ul id="categoryList" class="category-list">
          <!-- Las categorias se cargan dinamicamente via JS -->
          <li class="category-list-empty">Cargando categorias...</li>
        </ul>
      </div>

      <!-- Input para nombre de categoria -->
      <div class="dashboard-form-group">
        <label class="dashboard-form-label" for="category_name">Nombre de categoria</label>
        <input id="category_name"
               type="text"
               class="dashboard-form-input"
               placeholder="Nueva categoria">
      </div>

      <!-- Botones de accion -->
      <div class="category-actions">
        <button type="button" id="insertCategoryBtn" class="category-action-btn category-btn-insert">
          Insertar
        </button>
        <button type="button" id="editCategoryBtn" class="category-action-btn category-btn-edit" disabled>
          Editar
        </button>
        <button type="button" id="deleteCategoryBtn" class="category-action-btn category-btn-delete" disabled>
          Borrar
        </button>
      </div>

      <p id="categoryMessage" class="category-message"></p>
    </div>
  </section>

</div>

<!-- Modal de confirmación para eliminar categoría -->
<div id="deleteCategoryModal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title">Confirmar eliminación</h3>
    </div>
    <div class="modal-body">
      <p id="deleteCategoryModalMessage">
        <!-- El mensaje se genera dinámicamente -->
      </p>
      <div id="deleteCategoryUsageDetails" class="modal-usage-details">
        <!-- Los detalles de uso se generan dinámicamente -->
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" id="cancelDeleteCategoryBtn" class="modal-btn modal-btn-cancel">
        Cancelar
      </button>
      <button type="button" id="confirmDeleteCategoryBtn" class="modal-btn modal-btn-confirm">
        Eliminar
      </button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/right_panel.js') }}"></script>
<script src="{{ url_for('static', filename='js/category_manager.js') }}"></script>
