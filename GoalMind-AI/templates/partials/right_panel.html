<aside class="side-panel" id="dashboardSide">

  <div class="side-panel-card">
    <div class="side-panel-header">
      <h3 class="side-panel-title">Nuevo proyecto</h3>
    </div>

    <div class="side-panel-card-content">
      <form method="post"
            action="{{ url_for('project_bp.add_project') }}"
            class="panel-form">

        <div class="panel-form-group">
          <label class="panel-form-label" for="titulo">Titulo</label>
          <input type="text"
                 name="titulo"
                 id="titulo"
                 class="panel-form-input"
                 placeholder="Investigacion IA aplicada"
                 required>
        </div>

        <div class="panel-form-group">
          <label class="panel-form-label" for="descripcion">Descripcion</label>
          <textarea name="descripcion"
                    id="descripcion"
                    class="panel-form-textarea"
                    rows="3"
                    placeholder="Resumen y alcance del proyecto"></textarea>
        </div>

        <div class="panel-form-row">
          <div class="panel-form-group">
            <label class="panel-form-label" for="fecha_inicio">Fecha inicio</label>
            <input type="date"
                   name="fecha_inicio"
                   id="fecha_inicio"
                   class="panel-form-input">
          </div>
          <div class="panel-form-group">
            <label class="panel-form-label" for="fecha_fin">Fecha fin</label>
            <input type="date"
                   name="fecha_fin"
                   id="fecha_fin"
                   class="panel-form-input">
          </div>
        </div>

        <div class="panel-form-group">
          <label class="panel-form-label">Categorias</label>
          <div data-category-selector
               data-name="categorias"
               data-selected=""
               data-allow-create="true"></div>
        </div>

        <div class="panel-form-group">
          <label class="panel-form-label" for="prioridad">Prioridad</label>
          <select name="prioridad" id="prioridad" class="panel-form-select">
            <option value="Baja">Baja</option>
            <option value="Media" selected>Media</option>
            <option value="Alta">Alta</option>
          </select>
        </div>

        <div class="panel-form-group" style="max-width: 100%;">
          <label class="panel-form-label" for="estado">Estado</label>
          <select name="estado" id="estado" class="panel-form-select">
            <option value="Activo" selected>Activo</option>
            <option value="En pausa">En pausa</option>
            <option value="Completado">Completado</option>
          </select>
        </div>

        <button type="submit" class="panel-form-submit">Crear proyecto</button>
      </form>
    </div>
  </div>

  <div class="side-panel-card">
    <div class="side-panel-header">
      <h3 class="side-panel-title">Gestionar categorias</h3>
    </div>
    <div class="side-panel-card-content">
      <div class="panel-form-group">
        <label class="panel-form-label" for="category_search">Buscar categoria</label>
        <input id="category_search"
               type="text"
               class="panel-form-input"
               placeholder="Escribe para buscar...">
      </div>

      <div class="category-list-container">
        <ul id="categoryList" class="category-list">
          <li class="category-list-empty">Cargando categorias...</li>
        </ul>
      </div>

      <div class="panel-form-group">
        <label class="panel-form-label" for="category_name">Nombre de categoria</label>
        <input id="category_name"
               type="text"
               class="panel-form-input"
               placeholder="Nueva categoria">
      </div>

      <div class="category-actions">
        <button type="button" id="insertCategoryBtn" class="category-action-btn category-btn-insert">
          Insertar
        </button>
        <button type="button" id="editCategoryBtn" class="category-action-btn category-btn-edit" disabled>
          Editar
        </button>
        <button type="button" id="deleteCategoryBtn" class="category-action-btn category-btn-delete" disabled>
          Borrar
        </button>
      </div>

      <p id="categoryMessage" class="category-message"></p>
    </div>
  </div>

</aside>

<!-- Modal de confirmación para eliminar categoría -->
<div id="deleteCategoryModal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title">Confirmar eliminación</h3>
    </div>
    <div class="modal-body">
      <p id="deleteCategoryModalMessage">
        <!-- El mensaje se genera dinámicamente -->
      </p>
      <div id="deleteCategoryUsageDetails" class="modal-usage-details">
        <!-- Los detalles de uso se generan dinámicamente -->
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" id="cancelDeleteCategoryBtn" class="modal-btn modal-btn-cancel">
        Cancelar
      </button>
      <button type="button" id="confirmDeleteCategoryBtn" class="modal-btn modal-btn-confirm">
        Eliminar
      </button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/category_selector.js') }}"></script>
<script src="{{ url_for('static', filename='js/category_manager.js') }}"></script>
