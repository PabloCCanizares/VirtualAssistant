<div class="topbar">
  <div class="topbar-breadcrumbs">
    <span class="topbar-breadcrumbs-current">
      {% if page == 'dashboard' %}Dashboard
      {% elif page == 'agenda' %}Agenda
      {% elif page == 'objetivos' %}Objetivos
      {% elif page == 'tareas' %}Tareas
      {% elif page == 'estadisticas' %}Estadisticas
      {% elif page == 'config' %}Configuracion
      {% else %}Dashboard{% endif %}
    </span>
    <span class="topbar-breadcrumbs-separator">▸</span>
    <span>Semana actual</span>
  </div>

  <div class="topbar-actions">
    <button type="button" class="topbar-chip" data-action="new-appointment">
      📅 Nueva cita
    </button>
    <button type="button" class="topbar-chip" data-action="new-goal">
      🎯 Nuevo objetivo
    </button>
    <button type="button" class="topbar-chip primary" data-action="new-task">
      ➕ Nueva tarea
    </button>
  </div>
</div>
