
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Calendario de eventos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  

  <!-- FullCalendar 6 (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales-all.global.min.js"></script>

  <!-- Tus estilos -->
  <link rel="stylesheet" href="/static/css/calendar.css">
  
  <style>
    /* Estilos para el campo Asociar a */
    .association-field {
      position: relative;
    }
    
    .association-input-wrapper {
      position: relative;
    }
    
    .association-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 280px;
      overflow-y: auto;
      background: linear-gradient(135deg, rgba(16,24,43,.98), rgba(11,15,26,.95));
      border: 1px solid rgba(108,243,255,.25);
      border-radius: 8px;
      margin-top: 4px;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    
    .association-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.2s ease;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    
    .association-item:last-child {
      border-bottom: none;
    }
    
    .association-item:hover {
      background: rgba(108,243,255,.1);
    }
    
    .association-item-type {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }
    
    .association-item-type.tarea {
      background: rgba(55,225,143,.15);
      color: #37e18f;
      border: 1px solid rgba(55,225,143,.3);
    }
    
    .association-item-type.objetivo {
      background: rgba(139,123,255,.15);
      color: #8b7bff;
      border: 1px solid rgba(139,123,255,.3);
    }
    
    .association-item-title {
      flex: 1;
      font-size: 13px;
      color: var(--text, #e8edf5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .association-selected {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    
    .association-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .association-badge.tarea {
      background: rgba(55,225,143,.15);
      color: #37e18f;
      border: 1px solid rgba(55,225,143,.3);
    }
    
    .association-badge.objetivo {
      background: rgba(139,123,255,.15);
      color: #8b7bff;
      border: 1px solid rgba(139,123,255,.3);
    }
    
    .association-clear {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(255,107,136,.2);
      color: #ff6b88;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    
    .association-clear:hover {
      background: rgba(255,107,136,.35);
    }
    
    .association-no-results {
      padding: 14px;
      text-align: center;
      color: rgba(159,176,215,.6);
      font-size: 13px;
    }
    
    .association-loading {
      padding: 14px;
      text-align: center;
      color: rgba(108,243,255,.7);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="calendar-container">
    <div class="toolbar">
      <span class="badge">Calendario</span>
      <button id="btn-today" class="btn">Hoy</button>
      <button id="btn-new" class="btn primary">+ Nuevo evento</button>
    </div>
    <div id="calendar"></div>

    <!-- Vista de lista custom (modo Lista) -->
    <div id="eventsListView">
      <div class="elv-header">
        <h4 id="elvTitle">Próximos eventos</h4>
      </div>
      <div class="elv-body" id="elvBody"></div>
      <div class="elv-footer">
        <button class="elv-toggle-btn" id="elvToggleBtn">⏮ ver eventos pasados</button>
      </div>
    </div>
  </div>

  <!-- Modal Crear/Editar -->
  <div class="modal-backdrop" id="eventModalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Nuevo evento</h3>
      <form id="eventForm">
        <input type="hidden" id="eventId">
        <div class="field">
          <label for="titulo">Título *</label>
          <input type="text" id="titulo" required placeholder="p. ej., Reunión con equipo">
        </div>
        <div class="field">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" placeholder="Notas, agenda, enlaces…"></textarea>
        </div>
        <div class="field">
          <label for="tipo_evento">Tipo</label>
          <select id="tipo_evento">
            <option value="">(sin tipo)</option>
            <option value="reunion">Reunión</option>
            <option value="tarea">Tarea</option>
            <option value="recordatorio">Recordatorio</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="field">
          <label for="fecha_inicio">Inicio *</label>
          <input type="datetime-local" id="fecha_inicio" required>
        </div>
        <div class="field">
          <label for="fecha_fin">Fin *</label>
          <input type="datetime-local" id="fecha_fin" required>
        </div>

        <div class="field association-field">
          <label for="asociar_a">Asociar a</label>
          <div class="association-input-wrapper">
            <input type="text" id="asociar_a" placeholder="Buscar tarea u objetivo..." autocomplete="off">
            <input type="hidden" id="asociar_tipo" value="">
            <input type="hidden" id="asociar_id" value="">
            <div class="association-results" id="associationResults" style="display: none;">
              <!-- Los resultados se cargan dinámicamente -->
            </div>
          </div>
          <div class="association-selected" id="associationSelected" style="display: none;">
            <span class="association-badge" id="associationBadge"></span>
            <button type="button" class="association-clear" id="clearAssociation" title="Quitar asociación">&times;</button>
          </div>
        </div>

        <div class="actions">
          <button type="button" id="btn-cancel" class="btn ghost">Cancelar</button>
          <button type="button" id="btn-delete" class="btn danger" style="display:none">Eliminar</button>
          <button type="submit" class="btn primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ===== Utilidades puras (sin DOM) =====
    function isoToLocalInputValue(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function localInputValueToISO(val) {
      if (!val) return null;
      return new Date(val).toISOString();
    }
    function escapeHTML(s) {
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function padZ(n) { return String(n).padStart(2, '0'); }

    // Variables de módulo accesibles por todos los listeners
    let calendar = null;
    let elvMode = 'upcoming';
    const slotMin = '07:00:00';
    const slotMax = '24:00:00';

    document.addEventListener('DOMContentLoaded', function () {

      // ===== Referencias DOM =====
      const calendarEl    = document.getElementById('calendar');
      const container     = document.getElementById('calendar-container');
      const modalBackdrop = document.getElementById('eventModalBackdrop');
      const form          = document.getElementById('eventForm');
      const inputId       = document.getElementById('eventId');
      const inputTitulo   = document.getElementById('titulo');
      const inputDescripcion = document.getElementById('descripcion');
      const inputTipo     = document.getElementById('tipo_evento');
      const inputInicio   = document.getElementById('fecha_inicio');
      const inputFin      = document.getElementById('fecha_fin');
      const btnDelete     = document.getElementById('btn-delete');
      const btnCancel     = document.getElementById('btn-cancel');
      const btnNew        = document.getElementById('btn-new');
      const btnToday      = document.getElementById('btn-today');
      const modalTitle    = document.getElementById('modalTitle');
      const elvTitle      = document.getElementById('elvTitle');
      const elvBody       = document.getElementById('elvBody');
      const elvToggleBtn  = document.getElementById('elvToggleBtn');

      // Campos asociación
      const inputAsociar       = document.getElementById('asociar_a');
      const inputAsociarTipo   = document.getElementById('asociar_tipo');
      const inputAsociarId     = document.getElementById('asociar_id');
      const associationResults = document.getElementById('associationResults');
      const associationSelected= document.getElementById('associationSelected');
      const associationBadge   = document.getElementById('associationBadge');
      const clearAssociationBtn= document.getElementById('clearAssociation');

      let searchTimeout = null;
      let listaBtn = null; // se cachea tras calendar.render()

      // ===== Modo Lista =====
      function enterListMode() {
        container.classList.add('list-mode');
        container.querySelectorAll('.fc-button').forEach(btn => btn.classList.remove('fc-button-active'));
        if (listaBtn) listaBtn.classList.add('fc-button-active');
        elvMode = 'upcoming';
        elvTitle.textContent = 'Próximos eventos';
        elvToggleBtn.textContent = '⏮ ver eventos pasados';
        loadAndRenderTimeline('upcoming');
      }
      function exitListMode() {
        if (!container.classList.contains('list-mode')) return;
        container.classList.remove('list-mode');
        if (listaBtn) listaBtn.classList.remove('fc-button-active');
        // Recalcular layout: FullCalendar no conoce las dimensiones correctas
        // porque .fc-view-harness estaba en display:none
        if (calendar) calendar.updateSize();
      }

      async function loadAndRenderTimeline(type) {
        elvBody.innerHTML = '<div class="elv-loading">Cargando eventos...</div>';
        try {
          const res = await fetch(`/api/events/timeline?type=${type}`);
          const events = await res.json();
          renderTimeline(events, type);
        } catch {
          elvBody.innerHTML = '<div class="elv-empty">Error al cargar eventos.</div>';
        }
      }

      function renderTimeline(events, type) {
        if (!events.length) {
          elvBody.innerHTML = `<div class="elv-empty">No hay eventos ${type === 'past' ? 'pasados' : 'próximos'}.</div>`;
          return;
        }
        elvBody.innerHTML = events.map(ev => {
          const inicio  = new Date(ev.fecha_inicio);
          const fin     = new Date(ev.fecha_fin);
          const dateStr = inicio.toLocaleDateString('es', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
          const timeStr = `${padZ(inicio.getHours())}:${padZ(inicio.getMinutes())} – ${padZ(fin.getHours())}:${padZ(fin.getMinutes())}`;
          const tipo    = ev.tipo_evento || '';
          const desc    = ev.descripcion ? `<div class="elv-item-desc">${escapeHTML(ev.descripcion)}</div>` : '';
          return `
            <div class="elv-item" data-id="${ev._id}">
              <div class="elv-item-left">
                <span class="elv-item-date">${dateStr}</span>
                <span class="elv-item-time">${timeStr}</span>
              </div>
              <div class="elv-item-dot" data-tipo="${tipo}"></div>
              <div class="elv-item-right">
                <div class="elv-item-title">${escapeHTML(ev.titulo || '(sin título)')}</div>
                ${desc}
              </div>
            </div>`;
        }).join('');

        const evMap = {};
        events.forEach(ev => { evMap[ev._id] = ev; });
        elvBody.querySelectorAll('.elv-item').forEach(item => {
          item.addEventListener('click', () => {
            const ev = evMap[item.dataset.id];
            if (ev) openModal('edit', {
              _id: ev._id, id: ev._id, titulo: ev.titulo,
              fecha_inicio: ev.fecha_inicio, fecha_fin: ev.fecha_fin,
              descripcion: ev.descripcion, tipo_evento: ev.tipo_evento,
              extendedProps: { raw: ev }
            });
          });
        });
      }

      // ===== Asociación =====
      async function searchAssociations(query) {
        if (!query || query.length < 2) { associationResults.style.display = 'none'; return; }
        associationResults.innerHTML = '<div class="association-loading">Buscando...</div>';
        associationResults.style.display = 'block';
        try {
          const res = await fetch(`/api/search/associations?q=${encodeURIComponent(query)}&limit=10`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          if (!data.length) { associationResults.innerHTML = '<div class="association-no-results">No se encontraron resultados</div>'; return; }
          associationResults.innerHTML = data.map(item => {
            const tipoLabel = item.tipo === 'tarea' ? 'Tarea' : 'Objetivo';
            return `<div class="association-item" data-id="${item._id}" data-tipo="${item.tipo}" data-titulo="${item.titulo}">
              <span class="association-item-type ${item.tipo}">${tipoLabel}</span>
              <span class="association-item-title">${item.titulo}</span>
            </div>`;
          }).join('');
          associationResults.querySelectorAll('.association-item').forEach(item => {
            item.addEventListener('click', () => selectAssociation(item.dataset.id, item.dataset.tipo, item.dataset.titulo));
          });
        } catch {
          associationResults.innerHTML = '<div class="association-no-results">Error al buscar</div>';
        }
      }

      function selectAssociation(id, tipo, titulo) {
        inputAsociarId.value = id;
        inputAsociarTipo.value = tipo;
        inputAsociar.value = '';
        inputAsociar.style.display = 'none';
        associationResults.style.display = 'none';
        const tipoLabel = tipo === 'tarea' ? 'Tarea' : 'Objetivo';
        associationBadge.className = `association-badge ${tipo}`;
        associationBadge.textContent = `[${tipoLabel}] ${titulo}`;
        associationSelected.style.display = 'flex';
      }

      function clearAssociation() {
        inputAsociarId.value = '';
        inputAsociarTipo.value = '';
        inputAsociar.value = '';
        inputAsociar.style.display = 'block';
        associationSelected.style.display = 'none';
        associationResults.style.display = 'none';
      }

      // ===== Modal =====
      function openModal(mode, data = {}) {
        modalTitle.textContent = mode === 'edit' ? 'Editar evento' : 'Nuevo evento';
        inputId.value          = data._id || data.id || '';
        inputTitulo.value      = data.titulo || data.title || '';
        inputDescripcion.value = data.descripcion || data.extendedProps?.descripcion || '';
        inputTipo.value        = data.tipo_evento || data.extendedProps?.tipo_evento || '';
        inputInicio.value      = isoToLocalInputValue(data.fecha_inicio || data.start);
        inputFin.value         = isoToLocalInputValue(data.fecha_fin || data.end);
        btnDelete.style.display = mode === 'edit' ? 'inline-block' : 'none';
        clearAssociation();
        const raw = data.extendedProps?.raw || data;
        if (raw.referencia_id && raw.referencia_tipo) {
          loadAssociationInfo(raw.referencia_id, raw.referencia_tipo);
        } else if (raw.id_tarea) {
          loadAssociationInfo(raw.id_tarea, 'tarea');
        } else if (raw.id_objetivo) {
          loadAssociationInfo(raw.id_objetivo, 'objetivo');
        }
        modalBackdrop.style.display = 'flex';
      }

      async function loadAssociationInfo(id, tipo) {
        inputAsociarId.value = id;
        inputAsociarTipo.value = tipo;
        inputAsociar.style.display = 'none';
        const tipoLabel = tipo === 'tarea' ? 'Tarea' : 'Objetivo';
        associationBadge.className = `association-badge ${tipo}`;
        associationBadge.textContent = `[${tipoLabel}] Cargando...`;
        associationSelected.style.display = 'flex';
        try {
          const endpoint = tipo === 'tarea' ? `/tasks/search?id=${id}` : `/goals/${id}`;
          const res = await fetch(endpoint);
          if (res.ok) {
            const data = await res.json();
            const titulo = tipo === 'tarea' ? (data.contenido || 'Sin título') : (data.titulo || 'Sin título');
            associationBadge.textContent = `[${tipoLabel}] ${titulo}`;
          }
        } catch {
          associationBadge.textContent = `[${tipoLabel}] (ID: ${id.substring(0, 8)}...)`;
        }
      }

      function closeModal() {
        modalBackdrop.style.display = 'none';
        form.reset();
        inputId.value = '';
      }

      // ===== FullCalendar =====
      calendar = new FullCalendar.Calendar(calendarEl, {
        locale: 'es',
        timeZone: 'local',
        initialView: 'timeGridWeek',
        firstDay: 1,
        slotMinTime: slotMin,
        slotMaxTime: slotMax,
        nowIndicator: true,
        selectable: true,
        selectMirror: true,
        editable: true,
        eventResizableFromStart: true,
        customButtons: {
          listaCustom: { text: 'Lista', click: enterListMode }
        },
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay,listaCustom'
        },
        height: window.innerHeight,
        buttonText: { today: 'Hoy', month: 'Mes', week: 'Semana', day: 'Día' },
        viewDidMount: function () { exitListMode(); },
        events: async function (info, success, failure) {
          try {
            const res = await fetch(`/api/events?start=${encodeURIComponent(info.startStr)}&end=${encodeURIComponent(info.endStr)}`);
            if (!res.ok) throw new Error('Error al cargar eventos');
            const data = await res.json();
            success(data.map(e => ({
              id: e._id,
              title: e.titulo || '(Sin título)',
              start: e.fecha_inicio || e.start,
              end: e.fecha_fin || e.end,
              extendedProps: { descripcion: e.descripcion || '', tipo_evento: e.tipo_evento || '', raw: e }
            })));
          } catch (err) { console.error(err); failure(err); }
        },
        select: function (info) {
          openModal('new', { start: info.startStr, end: info.endStr });
        },
        eventClick: function (info) {
          const ev = info.event;
          openModal('edit', {
            id: ev.id, title: ev.title,
            start: ev.start?.toISOString(), end: ev.end?.toISOString(),
            extendedProps: ev.extendedProps || {},
            descripcion: ev.extendedProps?.descripcion || '',
            tipo_evento: ev.extendedProps?.tipo_evento || ''
          });
        },
        eventDrop:   async function (info) { await quickUpdateDates(info); },
        eventResize: async function (info) { await quickUpdateDates(info); }
      });

      calendar.render();
      listaBtn = container.querySelector('.fc-listaCustom-button');

      // Salir del modo lista al pulsar cualquier botón del toolbar excepto el de Lista.
      // viewDidMount no se dispara si la vista ya estaba montada (p.ej. volver a "Semana"
      // cuando FullCalendar ya tenía timeGridWeek activa), así que usamos event delegation.
      container.querySelector('.fc-header-toolbar')?.addEventListener('click', e => {
        const btn = e.target.closest('.fc-button');
        if (btn && !btn.classList.contains('fc-listaCustom-button')) {
          exitListMode();
        }
      });

      async function quickUpdateDates(info) {
        const ev = info.event;
        const payload = {
          fecha_inicio: ev.start?.toISOString(),
          fecha_fin: (ev.end ? ev.end : new Date(ev.start.getTime() + 30 * 60 * 1000)).toISOString()
        };
        try {
          const res = await fetch(`/api/events/${encodeURIComponent(ev.id)}`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
          });
          if (!res.ok) { info.revert(); throw new Error((await res.json().catch(() => ({}))).error || 'Error'); }
        } catch (err) { console.error(err); alert('No se pudieron actualizar las fechas del evento.'); }
      }

      // ===== Event listeners =====
      btnNew.addEventListener('click', () => {
        const now = new Date();
        openModal('new', { start: now.toISOString(), end: new Date(now.getTime() + 3600000).toISOString() });
      });
      btnToday.addEventListener('click', () => calendar.today());
      btnCancel.addEventListener('click', closeModal);
      modalBackdrop.addEventListener('click', e => { if (e.target === modalBackdrop) closeModal(); });
      clearAssociationBtn.addEventListener('click', clearAssociation);
      document.addEventListener('click', e => {
        if (!e.target.closest('.association-field')) associationResults.style.display = 'none';
      });
      inputAsociar.addEventListener('input', e => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => searchAssociations(e.target.value.trim()), 300);
      });
      inputAsociar.addEventListener('focus', () => {
        if (inputAsociar.value.trim().length >= 2) searchAssociations(inputAsociar.value.trim());
      });

      elvToggleBtn.addEventListener('click', () => {
        if (elvMode === 'upcoming') {
          elvMode = 'past';
          elvTitle.textContent = 'Eventos pasados';
          elvToggleBtn.textContent = '⏭ ver próximos eventos';
          loadAndRenderTimeline('past');
        } else {
          elvMode = 'upcoming';
          elvTitle.textContent = 'Próximos eventos';
          elvToggleBtn.textContent = '⏮ ver eventos pasados';
          loadAndRenderTimeline('upcoming');
        }
      });

      form.addEventListener('submit', async e => {
        e.preventDefault();
        const id = inputId.value.trim();
        const payload = {
          titulo: inputTitulo.value.trim(),
          descripcion: inputDescripcion.value.trim(),
          tipo_evento: inputTipo.value.trim() || null,
          fecha_inicio: localInputValueToISO(inputInicio.value),
          fecha_fin: localInputValueToISO(inputFin.value),
          referencia_id: null,
          referencia_tipo: null
        };
        const asociarTipo = inputAsociarTipo.value;
        const asociarId   = inputAsociarId.value;
        if (asociarId && (asociarTipo === 'tarea' || asociarTipo === 'objetivo')) {
          payload.referencia_id   = asociarId;
          payload.referencia_tipo = asociarTipo;
        }
        if (!payload.titulo) { alert('El título es obligatorio.'); return; }
        if (!payload.fecha_inicio || !payload.fecha_fin) { alert('Las fechas de inicio y fin son obligatorias.'); return; }
        if (new Date(payload.fecha_fin) <= new Date(payload.fecha_inicio)) { alert('La fecha/hora de fin debe ser posterior al inicio.'); return; }
        try {
          const res = await fetch(
            id ? `/api/events/${encodeURIComponent(id)}` : '/api/events',
            { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }
          );
          const data = await res.json();
          if (!res.ok) throw new Error(data?.error || 'Error guardando');
          closeModal();
          calendar.refetchEvents();
        } catch (err) { console.error(err); alert('No se pudo guardar el evento.'); }
      });

      btnDelete.addEventListener('click', async () => {
        const id = inputId.value.trim();
        if (!id || !confirm('¿Eliminar este evento?')) return;
        try {
          const res  = await fetch(`/api/events/${encodeURIComponent(id)}`, { method: 'DELETE' });
          const data = await res.json();
          if (!res.ok || !data?.deleted) throw new Error('Error eliminando');
          closeModal();
          calendar.refetchEvents();
        } catch (err) { console.error(err); alert('No se pudo eliminar el evento.'); }
      });

      window.addEventListener('resize', () => {
        if (!container.classList.contains('list-mode')) {
          calendar.setOption('height', window.innerHeight);
        }
      });

    }); // fin DOMContentLoaded
  </script>
</body>
</html>
