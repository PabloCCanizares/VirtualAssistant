      overflow-y: auto;

    .association-selected {

    // ---------- Utilidades de fecha ----------
    // Convierte ISO (UTC o con offset) -> valor válido para input datetime-local (en hora local)
    function isoToLocalInputValue(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const pad = n => String(n).padStart(2, "0");
      const yyyy = d.getFullYear();
      const mm = pad(d.getMonth() + 1);
      const dd = pad(d.getDate());
      const hh = pad(d.getHours());
      const mi = pad(d.getMinutes());
      return `${yyyy}-${mm}-${dd}T${hh}:${mi}`;
    }
    // Convierte valor de <input type="datetime-local"> -> ISO (toISOString())
    function localInputValueToISO(val) {
      if (!val) return null;
      // Interpretado en zona local por el navegador
      const d = new Date(val);
      return d.toISOString();
    }

    let searchTimeout = null;

    // ---------- Funciones de asociación ----------
    async function searchAssociations(query) {
      if (!query || query.length < 2) {
        associationResults.style.display = 'none';
        return;
      }
      
      associationResults.innerHTML = '<div class="association-loading">Buscando...</div>';
      associationResults.style.display = 'block';
      
      try {
        const res = await fetch(`/api/search/associations?q=${encodeURIComponent(query)}&limit=10`);
        if (!res.ok) throw new Error('Error en búsqueda');
        const data = await res.json();
        
        if (data.length === 0) {
          associationResults.innerHTML = '<div class="association-no-results">No se encontraron resultados</div>';
          return;
        }
        
        let html = '';
        data.forEach(item => {
          const tipoLabel = item.tipo === 'tarea' ? 'Tarea' : 'Objetivo';
          html += `
            <div class="association-item" data-id="${item._id}" data-tipo="${item.tipo}" data-titulo="${item.titulo}">
              <span class="association-item-type ${item.tipo}">${tipoLabel}</span>
              <span class="association-item-title">${item.titulo}</span>
            </div>
          `;
        });
        associationResults.innerHTML = html;
        
        // Agregar event listeners a los items
        associationResults.querySelectorAll('.association-item').forEach(item => {
          item.addEventListener('click', () => {
            selectAssociation(item.dataset.id, item.dataset.tipo, item.dataset.titulo);
          });
        });
      } catch (err) {
        console.error(err);
        associationResults.innerHTML = '<div class="association-no-results">Error al buscar</div>';
      }
    }
    
    function selectAssociation(id, tipo, titulo) {
      inputAsociarId.value = id;
      inputAsociarTipo.value = tipo;
      inputAsociar.value = '';
      inputAsociar.style.display = 'none';
      associationResults.style.display = 'none';
      
      const tipoLabel = tipo === 'tarea' ? 'Tarea' : 'Objetivo';
      associationBadge.className = `association-badge ${tipo}`;
      associationBadge.textContent = `[${tipoLabel}] ${titulo}`;
      associationSelected.style.display = 'flex';
    }
    
    function clearAssociation() {
      inputAsociarId.value = '';
      inputAsociarTipo.value = '';
      inputAsociar.value = '';
      inputAsociar.style.display = 'block';
      associationSelected.style.display = 'none';
      associationResults.style.display = 'none';
    }
    
    // Event listeners para el campo de asociación
    inputAsociar.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();
      searchTimeout = setTimeout(() => searchAssociations(query), 300);
    });
    
    inputAsociar.addEventListener('focus', () => {
      if (inputAsociar.value.trim().length >= 2) {
        searchAssociations(inputAsociar.value.trim());
      }
    });
    
    clearAssociationBtn.addEventListener('click', clearAssociation);
    
    // Cerrar resultados al hacer clic fuera
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.association-field')) {
        associationResults.style.display = 'none';
      }
    });

    function refreshAutoTimeLayer() {
      if (inputCapa.dataset.autoLayer === '0') return;
      inputCapa.value = inferTimeLayer(inputTipo.value, inputTitulo.value, inputDescripcion.value);
      inputCapa.dataset.autoLayer = '1';
    }

    inputTipo.addEventListener('change', () => {
      inputCapa.dataset.autoLayer = '1';
      refreshAutoTimeLayer();
    });
    inputTitulo.addEventListener('input', refreshAutoTimeLayer);
    inputDescripcion.addEventListener('input', refreshAutoTimeLayer);
    inputCapa.addEventListener('change', () => {
      inputCapa.dataset.autoLayer = '0';
    });

    function openModal(mode, data = {}) {
      modalTitle.textContent = mode === 'edit' ? 'Editar evento' : 'Nuevo evento';
      const rawData = data.extendedProps?.raw || data;
      inputId.value = data._id || data.id || '';
      inputTitulo.value = data.titulo || data.title || '';
      inputDescripcion.value = data.descripcion || data.extendedProps?.descripcion || '';
      inputTipo.value = data.tipo_evento || data.extendedProps?.tipo_evento || '';
      inputCapa.value = rawData.capa_tiempo || data.capa_tiempo || data.extendedProps?.capa_tiempo || inferTimeLayer(inputTipo.value, inputTitulo.value, inputDescripcion.value);
      inputCapa.dataset.autoLayer = rawData.capa_tiempo || data.capa_tiempo || data.extendedProps?.capa_tiempo ? '0' : '1';
      inputInicio.value = isoToLocalInputValue(data.fecha_inicio || data.start);
      inputFin.value = isoToLocalInputValue(data.fecha_fin || data.end);
      btnDelete.style.display = mode === 'edit' ? 'inline-block' : 'none';
      
      // Limpiar y configurar asociación
      clearAssociation();
      
      // Si es edición y hay asociación previa, mostrarla
      if (rawData.referencia_id && rawData.referencia_tipo) {
        // Nuevo formato unificado
        loadAssociationInfo(rawData.referencia_id, rawData.referencia_tipo);
      } else if (rawData.id_tarea) {
        // Compatibilidad con datos antiguos
        loadAssociationInfo(rawData.id_tarea, 'tarea');
      } else if (rawData.id_objetivo) {
        // Compatibilidad con datos antiguos
        loadAssociationInfo(rawData.id_objetivo, 'objetivo');
      }
      
      modalBackdrop.style.display = 'flex';
    }
    
    async function loadAssociationInfo(id, tipo) {
      // Mostrar la asociación existente
      inputAsociarId.value = id;
      inputAsociarTipo.value = tipo;
      inputAsociar.style.display = 'none';
      
      const tipoLabel = tipo === 'tarea' ? 'Tarea' : 'Objetivo';
      associationBadge.className = `association-badge ${tipo}`;
      associationBadge.textContent = `[${tipoLabel}] Cargando...`;
      associationSelected.style.display = 'flex';
      
      // Intentar obtener el título real (opcional, para mejor UX)
      try {
        const endpoint = tipo === 'tarea' ? `/tasks/search?id=${id}` : `/goals/${id}`;
        const res = await fetch(endpoint);
        if (res.ok) {
          const data = await res.json();
          const titulo = tipo === 'tarea' ? (data.contenido || 'Sin título') : (data.titulo || 'Sin título');
          associationBadge.textContent = `[${tipoLabel}] ${titulo}`;
        }
      } catch (err) {
        // Si falla, mantener el texto genérico
        associationBadge.textContent = `[${tipoLabel}] (ID: ${id.substring(0, 8)}...)`;
      }
    }

    function getHourPixelHeight(){
      // lee la variable CSS --hour-h de tu contenedor (fallback 48)
      const el = document.querySelector('#calendar-container') || document.documentElement;
      const v = getComputedStyle(el).getPropertyValue('--hour-h');

      const hours = Math.max(1, minutes / 60);
      return Math.round(hours * getHourPixelHeight() + extraPx);
    }

    function cloneDate(date) {

    function cellAddDays(date, days) {
      const next = cloneDate(date);
      next.setDate(next.getDate() + days);
      return next;

    function cellStartOfWeek(date) {
      const start = cloneDate(date);
      start.setHours(0, 0, 0, 0);
      const mondayOffset = (start.getDay() + 6) % 7;
      start.setDate(start.getDate() - mondayOffset);
      return start;
    }

    function sameDay(a, b) {
      return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
    }

    function cellDayKey(date) {
      return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function eventEndDate(event) {
      if (event.end) return event.end;
      return new Date(event.start.getTime() + 30 * 60 * 1000);
    }

    function eventType(event) {
      return event.extendedProps?.tipo_evento || event.extendedProps?.raw?.tipo_evento || 'otro';
    }

    function normalizeTimeLayerText(value) {
      return String(value || '')
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function inferTimeLayer(tipo = '', title = '', description = '') {
      const haystack = [
        normalizeTimeLayerText(tipo),
        normalizeTimeLayerText(title),
        normalizeTimeLayerText(description)
      ].join(' ');
      for (const [hint, layer] of Object.entries(timeLayerHints)) {
        if (haystack.includes(hint)) return layer;
      }
      return 'productivo';
    }

    function eventTimeLayer(event) {
      const raw = event.extendedProps?.raw || {};
      const explicit = normalizeTimeLayerText(
        raw.capa_tiempo || event.extendedProps?.capa_tiempo || event.capa_tiempo
      );
      if (timeLayerLabels[explicit]) return explicit;
      return inferTimeLayer(eventType(event), event.title, raw.descripcion || event.extendedProps?.descripcion || '');
    }

    function timeLayerLabel(layer) {
      return timeLayerLabels[layer] || timeLayerLabels.productivo;
    }

    function timeLayerPayload(layer) {
      return {
        capa_tiempo: layer,
        bloquea_disponibilidad: true,
        cuenta_productivo: layer === 'productivo',
        cuenta_recuperacion: recoveryLayers.has(layer),
        carga_mental: layer === 'productivo' ? 'media' : 'baja',
        carga_fisica: layer === 'salud' ? 'media' : 'baja'
      };
    }

    function formatCellTime(date) {
      return `${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
    }

    function formatMinutesCompact(totalMinutes) {
      const safeMinutes = Math.max(0, Math.round(totalMinutes || 0));
      if (!safeMinutes) return '0h';
      const hours = Math.floor(safeMinutes / 60);
      const minutes = safeMinutes % 60;
      if (!hours) return `${minutes}m`;
      return minutes ? `${hours}h ${minutes}m` : `${hours}h`;
    }

    function renderSummaryLayerBar(layerMinutes) {
      const total = Object.values(layerMinutes).reduce((sum, minutes) => sum + minutes, 0);
      if (!total) {
        return '<div class="calendar-summary-layerbar is-empty" aria-label="Sin tiempo planificado"></div>';
      }
      const segments = summaryLayerOrder
        .filter(layer => layerMinutes[layer] > 0)
        .map(layer => {
          const minutes = layerMinutes[layer];
          const label = summaryLayerShortLabels[layer] || timeLayerLabel(layer);
          return `
            <span
              class="calendar-summary-segment"
              data-capa="${escapeHtml(layer)}"
              style="--summary-segment-flex:${Math.max(8, minutes)}"
              title="${escapeHtml(`${timeLayerLabel(layer)} ${formatMinutesCompact(minutes)}`)}"
              aria-label="${escapeHtml(`${timeLayerLabel(layer)} ${formatMinutesCompact(minutes)}`)}"
            >
              ${escapeHtml(label)}
            </span>
          `;
        })
        .join('');
      return `<div class="calendar-summary-layerbar">${segments}</div>`;
    }

    function metricLevel(value) {
      const text = normalizeTimeLayerText(value);
      if (!text || text.startsWith('pend')) return 0;
      if (['baja', 'bajo', 'low', 'ligera', 'ligero'].some(token => text.includes(token))) return 1;
      if (['media', 'medio', 'moderada', 'moderado', 'normal'].some(token => text.includes(token))) return 2;
      if (['alta', 'alto', 'high', 'intensa', 'intenso'].some(token => text.includes(token))) return 3;
      const numeric = Number(String(value || '').replace(',', '.').replace(/[^\d.]/g, ''));
      if (!Number.isFinite(numeric)) return 0;
      if (numeric <= 1) return 1;
      if (numeric <= 3) return 2;
      return 3;
    }

    function renderSummaryDots(label, value, kind) {
      const level = metricLevel(value);
      const dots = [1, 2, 3]
        .map(index => `<i class="${index <= level ? 'is-on' : ''}" aria-hidden="true"></i>`)
        .join('');
      return `
        <span class="calendar-summary-meter" data-meter="${escapeHtml(kind)}" title="${escapeHtml(`${label}: ${value || 'Pend.'}`)}">
          <small>${escapeHtml(label)}</small>
          <em>${dots}</em>
        </span>
      `;
    }

    function loadLabelFromProductiveMinutes(productiveMinutes) {
      const minutes = Math.max(0, Math.round(productiveMinutes || 0));
      if (!minutes) return 'Sin carga';
      const compact = formatMinutesCompact(minutes);
      if (minutes >= 7 * 60) return `Alta (${compact})`;
      if (minutes >= 3 * 60) return `Media (${compact})`;
      return `Baja (${compact})`;
    }

    function eventProductiveMinutesOnDay(event, dateKey) {
      if (!event.start || event.allDay || eventTimeLayer(event) !== 'productivo') return 0;
      const range = cellEventMinutesOnDay(event, dateKey);
      return Math.max(0, range.end - range.start);
    }

    function dayFocusFromTimeLayers(dayEvents, dateKey) {
      const productiveBlocks = dayEvents
        .map(event => eventProductiveMinutesOnDay(event, dateKey))
        .filter(minutes => minutes > 0);
      const productiveMinutes = productiveBlocks.reduce((sum, minutes) => sum + minutes, 0);
      const longBlocks = productiveBlocks.filter(minutes => minutes >= 60).length;

      if (!productiveMinutes) return 'Sin foco';
      if (longBlocks >= 2 || productiveMinutes >= 180) return `Alta (${formatMinutesCompact(productiveMinutes)})`;
      if (longBlocks >= 1 || productiveMinutes >= 90) return `Media (${formatMinutesCompact(productiveMinutes)})`;
      return `Baja (${formatMinutesCompact(productiveMinutes)})`;
    }

    function dayWeatherChip(day) {
      const metric = dayWeatherMetric(day);
      const info = weatherInfo(metric);
      const temp = formatWeatherTempRange(metric, { compact: true });
      const heat = weatherHeatLevel(metric);
      if (info.label === 'Pend.') return '<span aria-hidden="true">&#9729;</span><b>--</b>';
      return `<span aria-hidden="true">${info.icon}</span><b data-heat="${escapeHtml(heat)}">${escapeHtml(temp || info.label)}</b>`;
    }

    function formatCellDuration(event) {
      const end = eventEndDate(event);
      const minutes = Math.max(15, Math.round((end - event.start) / 60000));
      if (minutes < 60) return `${minutes}m`;
      const hours = Math.floor(minutes / 60);
      const rest = minutes % 60;
      return rest ? `${hours}h ${rest}m` : `${hours}h`;
    }

    function formatCellDateLong(date) {
      return new Intl.DateTimeFormat('es-ES', {
        weekday: 'long',
        day: '2-digit',
        month: 'long'
      }).format(date);
    }

    function formatCellRange(event) {
      if (event.allDay) return 'Todo el dia';
      return `${formatCellTime(event.start)} - ${formatCellTime(eventEndDate(event))}`;
    }

    function firstMetricValue(source, keys, fallback = 'Pendiente') {
      for (const key of keys) {
        const value = source?.[key];
        if (value !== undefined && value !== null && String(value).trim() !== '') {
          return String(value);
        }
      }
      return fallback;
    }

    function eventLoadLabel(event) {
      const raw = event.extendedProps?.raw || {};
      const explicit = firstMetricValue(raw, ['carga', 'carga_llm', 'load', 'workload'], '');
      if (explicit) return explicit;
      const layer = eventTimeLayer(event);
      if (layer !== 'productivo') return `No productiva (${timeLayerLabel(layer)})`;
      return loadLabelFromProductiveMinutes(eventProductiveMinutesOnDay(event, cellDayKey(event.start)));
    }

    function eventFocusLabel(event) {
      const raw = event.extendedProps?.raw || {};
      return firstMetricValue(raw, ['foco', 'foco_llm', 'focus', 'focus_mode']);
    }

    function dayMetricValue(events, day, keys, fallback = 'Pend.') {
      const dayEvents = eventsForCellDay(events, day);
      for (const event of dayEvents) {
        const value = firstMetricValue(event.extendedProps?.raw || {}, keys, '');
        if (value) return value;
      }
      return fallback;
    }

    function formatSleepLabel(value) {
      const text = String(value || '').trim();
      if (!text || text.toLowerCase().startsWith('pend')) return 'Pend.';
      const normalized = text.replace(',', '.').replace(/[^\d.]/g, '');
      const hoursValue = Number(normalized);
      if (Number.isFinite(hoursValue) && normalized) {
        const hours = Math.floor(hoursValue);
        const minutes = Math.round((hoursValue - hours) * 60);
        return minutes ? `${hours}h ${minutes}m` : `${hours}h`;
      }
      return text;
    }

    function daySleepLabel(events, day) {
      const metric = sleepMetricsByDate[cellDayKey(day)];
      if (metric && metric.sleep_hours !== undefined && metric.sleep_hours !== null && metric.sleep_hours !== '') {
        return formatSleepLabel(metric.sleep_hours);
      }
      const value = dayMetricValue(events, day, [
        'horas_sueno',
        'sueno_horas',
        'sleep_hours',
        'sleep_duration',
        'sleep',
        'descanso'
      ]);
      return formatSleepLabel(value);
    }

    function sleepInputValue(day) {
      const metric = sleepMetricsByDate[cellDayKey(day)];
      const value = metric?.sleep_hours;
      if (value === undefined || value === null || value === '') return '';
      return String(value).replace(/\.0$/, '');
    }

    function sleepStatusLabel(day) {
      const metric = sleepMetricsByDate[cellDayKey(day)];
      if (!metric || metric.sleep_hours === undefined || metric.sleep_hours === null || metric.sleep_hours === '') {
        return 'Pend.';
      }
      return metric.sleep_source === 'device' ? 'Disp.' : 'Manual';
    }

    function moodOption(score) {
      const numeric = Number(score);
      return moodOptions.find(option => option.score === numeric) || null;
    }

    function dayMoodScore(day) {
      const metric = sleepMetricsByDate[cellDayKey(day)];
      const score = metric?.mood_score;
      return score === undefined || score === null || score === '' ? null : Number(score);
    }

    function dayMoodFace(day) {
      return moodOption(dayMoodScore(day))?.face || '&#9786;';
    }

    function dayMoodLabel(day) {
      return moodOption(dayMoodScore(day))?.label || 'Elegir';
    }

    function dayMoodSummary(day) {
      const option = moodOption(dayMoodScore(day));
      if (!option) return 'Pend.';
      return `${option.face} ${escapeHtml(option.label)}`;
    }

    function dayWeatherMetric(day) {
      return sleepMetricsByDate[cellDayKey(day)] || {};
    }

    function weatherInfo(metric) {
      const code = metric?.weather_code;
      if (code === undefined || code === null || code === '') {
        return { label: 'Pend.', icon: '&#9729;' };
      }
      return weatherLabels[Number(code)] || { label: metric.weather_label || 'Tiempo', icon: '&#9729;' };
    }

    function formatWeatherTemp(value) {
      if (value === undefined || value === null || value === '') return '';
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return '';
      return `${Math.round(numeric)}C`;
    }

    function weatherTempNumber(value) {
      if (value === undefined || value === null || value === '') return null;
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric : null;
    }

    function formatWeatherTempRange(metric, options = {}) {
      const compact = Boolean(options.compact);
      const min = weatherTempNumber(metric?.weather_temp_min_c);
      const max = weatherTempNumber(metric?.weather_temp_max_c);
      const mean = weatherTempNumber(metric?.weather_temp_mean_c);
      const minLabel = min !== null ? formatWeatherTemp(min) : '';
      const maxLabel = max !== null ? formatWeatherTemp(max) : '';

      if (minLabel && maxLabel) {
        if (Math.round(min) === Math.round(max)) return maxLabel;
        return compact ? `${minLabel}/${maxLabel}` : `${minLabel} min / ${maxLabel} max`;
      }
      if (maxLabel) return compact ? `${maxLabel} max` : `max ${maxLabel}`;
      if (minLabel) return compact ? `${minLabel} min` : `min ${minLabel}`;
      return mean !== null ? formatWeatherTemp(mean) : '';
    }

    function weatherHeatLevel(metric) {
      const max = weatherTempNumber(metric?.weather_temp_max_c ?? metric?.weather_temp_mean_c);
      if (max === null) return 'unknown';
      if (max >= 35) return 'extreme';
      if (max >= 30) return 'hot';
      if (max >= 27) return 'warm';
      return 'normal';
    }

    function formatWeatherRain(value) {
      if (value === undefined || value === null || value === '') return '';
      const numeric = Number(value);
      if (!Number.isFinite(numeric) || numeric <= 0) return '0mm';
      return `${numeric.toFixed(numeric < 1 ? 1 : 0)}mm`;
    }

    function dayWeatherSummary(day) {
      const metric = dayWeatherMetric(day);
      const info = weatherInfo(metric);
      const temp = formatWeatherTempRange(metric);
      if (info.label === 'Pend.') return 'Pend.';
      return `${info.icon} ${escapeHtml(info.label)}${temp ? ` ${escapeHtml(temp)}` : ''}`;
    }

    function renderWeatherCell(day) {
      const metric = dayWeatherMetric(day);
      const info = weatherInfo(metric);
      const temp = formatWeatherTempRange(metric, { compact: true });
      const heat = weatherHeatLevel(metric);
      const rain = formatWeatherRain(metric.weather_precipitation_mm);
      const location = metric.weather_location_name || '';
      return `
        <span class="calendar-cell-weather-icon">${info.icon}</span>
        <strong>${escapeHtml(info.label)}</strong>
        <em data-heat="${escapeHtml(heat)}" title="${escapeHtml(formatWeatherTempRange(metric) || 'Temperatura pendiente')}">${escapeHtml(temp || '--')}</em>
        <small>${escapeHtml(rain || '--')}</small>
        ${location ? `<i>${escapeHtml(location)}</i>` : ''}
      `;
    }

    function renderMoodOptions(dateKey, selectedScore) {
      return moodOptions.map(option => {
        const selectedClass = Number(selectedScore) === option.score ? ' is-selected' : '';
        return `
          <button type="button" class="calendar-cell-mood-option${selectedClass}" data-mood-date="${escapeHtml(dateKey)}" data-mood-score="${option.score}" role="option" aria-selected="${selectedClass ? 'true' : 'false'}">
            <span>${option.face}</span>
            <strong>${escapeHtml(option.label)}</strong>
          </button>
        `;
      }).join('');
    }

    async function loadSleepMetricsForDays(days) {
      if (!days.length) return;
      const start = cellDayKey(days[0]);
      const end = cellDayKey(days[days.length - 1]);
      const rangeKey = `${start}:${end}`;
      if (rangeKey === sleepMetricsRangeKey || rangeKey === sleepMetricsLoadingKey) return;

      sleepMetricsLoadingKey = rangeKey;
      try {
        const res = await fetch(`/api/daily-metrics?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}&weather=1`);
        if (!res.ok) throw new Error('Error al cargar metricas diarias');
        const data = await res.json();
        const next = { ...sleepMetricsByDate };
        days.forEach(day => {
          delete next[cellDayKey(day)];
        });
        data.forEach(metric => {
          if (metric.date) next[metric.date] = metric;
        });
        sleepMetricsByDate = next;
        sleepMetricsRangeKey = rangeKey;
        if (cellModeActive) renderCellView();
      } catch (err) {
        console.error(err);
      } finally {
        sleepMetricsLoadingKey = '';
      }
    }

    async function saveMoodScore(dateKey, moodScore, trigger) {
      const score = Number(moodScore);
      if (!Number.isInteger(score) || score < 1 || score > 5) return;

      trigger?.classList.add('is-saving');
      try {
        const res = await fetch(`/api/daily-metrics/${encodeURIComponent(dateKey)}/mood`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mood_score: score, source: 'manual' })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error || 'Error guardando animo');
        sleepMetricsByDate[dateKey] = data;
        openMoodDateKey = null;
        renderCellView();
      } catch (err) {
        console.error(err);
        alert('No se pudo guardar el animo.');
      } finally {
        trigger?.classList.remove('is-saving');
      }
    }

    async function saveSleepHours(dateKey, rawValue, input) {
      const normalized = String(rawValue ?? '').trim().replace(',', '.');
      let sleepHours = null;
      if (normalized !== '') {
        sleepHours = Number(normalized);
        if (!Number.isFinite(sleepHours) || sleepHours < 0 || sleepHours > 24) {
          input?.classList.add('is-error');
          alert('Introduce horas de sueno entre 0 y 24.');
          return;
        }
      }

      const statusEl = document.querySelector(`[data-sleep-status="${dateKey}"]`);
      input?.classList.remove('is-error');
      input?.classList.add('is-saving');
      if (statusEl) statusEl.textContent = 'Guardando';

      try {
        const res = await fetch(`/api/daily-metrics/${encodeURIComponent(dateKey)}/sleep`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sleep_hours: sleepHours, source: 'manual' })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error || 'Error guardando sueno');
        sleepMetricsByDate[dateKey] = data;
        renderCellView();
      } catch (err) {
        console.error(err);
        input?.classList.add('is-error');
        if (statusEl) statusEl.textContent = 'Error';
        alert('No se pudieron guardar las horas de sueno.');
      } finally {
        input?.classList.remove('is-saving');
      }
    }

    function isAllDayOnDate(event, day) {
      if (!event.allDay) return false;
      const eventStart = cloneDate(event.start);
      const eventEnd = event.end ? cloneDate(event.end) : cellAddDays(eventStart, 1);
      eventStart.setHours(0, 0, 0, 0);
      eventEnd.setHours(0, 0, 0, 0);
      const dayStart = cloneDate(day);
      dayStart.setHours(0, 0, 0, 0);
      const dayEnd = cellAddDays(dayStart, 1);
      return eventStart < dayEnd && eventEnd > dayStart;
    }

    function cellEventBlockPlacement(event, day, visibleStartHour, visibleEndHour, gridEl) {
      if (!event.start || event.allDay) return false;
      const end = eventEndDate(event);
      const visibleStart = cloneDate(day);
      visibleStart.setHours(visibleStartHour, 0, 0, 0);
      const visibleEnd = cloneDate(day);
      visibleEnd.setHours(visibleEndHour, 0, 0, 0);
      if (event.start >= visibleEnd || end <= visibleStart) return false;

      const renderStart = event.start < visibleStart ? visibleStart : event.start;
      const renderEnd = end > visibleEnd ? visibleEnd : end;
      const hourIndex = Math.floor((renderStart - visibleStart) / 3600000);
      const slotHour = visibleStartHour + hourIndex;
      const slot = gridEl.querySelector(`[data-cell-date="${cellDayKey(day)}"][data-cell-hour="${pad2(slotHour)}"]`);
      if (!slot) return false;
      const gridRect = gridEl.getBoundingClientRect();
      const slotRect = slot.getBoundingClientRect();
      const topMinutes = Math.max(0, ((renderStart - visibleStart) / 60000) - hourIndex * 60);
      const durationMinutes = Math.max(15, (renderEnd - renderStart) / 60000);
      return {
        left: slotRect.left - gridRect.left,
        top: slotRect.top - gridRect.top + (topMinutes / 60) * slotRect.height,
        width: Math.max(24, slotRect.width),
        height: Math.max(20, (durationMinutes / 60) * slotRect.height),
        renderStartMs: renderStart.getTime(),
        renderEndMs: renderEnd.getTime(),
        lane: 0,
      };
    }

    function cellDateFromKey(dateKey) {
      const [year, month, day] = String(dateKey).split('-').map(Number);
      return new Date(year, month - 1, day);
    }

    function cellDateAtMinutes(dateKey, minutes) {
      const date = cellDateFromKey(dateKey);
      date.setHours(0, minutes, 0, 0);
      return date;
    }

    function cellMinutesForDate(date) {
      return date.getHours() * 60 + date.getMinutes() + (date.getSeconds() / 60);
    }

    function clampCellMinutes(minutes) {
      return Math.max(timeStrToMinutes(slotMin), Math.min(timeStrToMinutes(slotMax), minutes));
    }

    function roundCellMinutes(minutes) {
      return clampCellMinutes(Math.round(minutes / cellInteractionStepMinutes) * cellInteractionStepMinutes);
    }

    function cellDayKeyFromPointer(clientX) {
      const firstHour = pad2(Math.floor(timeStrToMinutes(slotMin) / 60));
      const firstRowCells = Array.from(document.querySelectorAll(`.calendar-cell-slot[data-cell-hour="${firstHour}"]`));
      const direct = firstRowCells.find(cell => {
        const rect = cell.getBoundingClientRect();
        return clientX >= rect.left && clientX <= rect.right;
      });
      if (direct) return direct.dataset.cellDate;

      const closest = firstRowCells
        .map(cell => {
          const rect = cell.getBoundingClientRect();
          const distance = clientX < rect.left ? rect.left - clientX : clientX - rect.right;
          return { cell, distance };
        })
        .sort((a, b) => a.distance - b.distance)[0];
      return closest?.cell?.dataset.cellDate || null;
    }

    function cellMinuteFromPointer(clientY) {
      const gridEl = document.querySelector('#calendar-cell-grid-wrap .calendar-cell-grid');
      if (!gridEl) return null;
      const firstHour = pad2(Math.floor(timeStrToMinutes(slotMin) / 60));
      const firstCell = gridEl.querySelector(`.calendar-cell-slot[data-cell-hour="${firstHour}"]`);
      if (!firstCell) return null;
      const firstRect = firstCell.getBoundingClientRect();
      const hourHeight = firstRect.height || cellHourHeight;
      const rawMinutes = timeStrToMinutes(slotMin) + ((clientY - firstRect.top) / hourHeight) * 60;
      return roundCellMinutes(rawMinutes);
    }

    function cellPointerDateTime(event, fixedDateKey = null) {
      const dateKey = fixedDateKey || cellDayKeyFromPointer(event.clientX);
      const minutes = cellMinuteFromPointer(event.clientY);
      if (!dateKey || minutes === null) return null;
      return {
        dateKey,
        minutes,
        date: cellDateAtMinutes(dateKey, minutes)
      };
    }

    function cellPositionForMinute(dateKey, minutes) {
      const gridEl = document.querySelector('#calendar-cell-grid-wrap .calendar-cell-grid');
      if (!gridEl) return null;
      const clamped = clampCellMinutes(minutes);
      const hour = Math.min(Math.floor(clamped / 60), Math.floor((timeStrToMinutes(slotMax) - 1) / 60));
      const slot = gridEl.querySelector(`[data-cell-date="${dateKey}"][data-cell-hour="${pad2(hour)}"]`);
      if (!slot) return null;
      const gridRect = gridEl.getBoundingClientRect();
      const slotRect = slot.getBoundingClientRect();
      const minuteOffset = clamped - hour * 60;
      return {
        left: slotRect.left - gridRect.left,
        top: slotRect.top - gridRect.top + (minuteOffset / 60) * slotRect.height,
        width: slotRect.width,
        hourHeight: slotRect.height
      };
    }

    function cellPlacementFromMinutes(dateKey, startMinutes, endMinutes) {
      const start = clampCellMinutes(Math.min(startMinutes, endMinutes));
      const end = clampCellMinutes(Math.max(startMinutes, endMinutes));
      const startPosition = cellPositionForMinute(dateKey, start);
      if (!startPosition) return null;
      return {
        left: startPosition.left,
        top: startPosition.top,
        width: startPosition.width,
        height: Math.max(20, ((end - start) / 60) * startPosition.hourHeight)
      };
    }

    function applyCellPlacement(element, placement) {
      if (!element || !placement) return;
      element.style.setProperty('--cell-event-left', `${placement.left}px`);
      element.style.setProperty('--cell-event-top', `${placement.top}px`);
      element.style.setProperty('--cell-event-width', `${placement.width}px`);
      element.style.setProperty('--cell-event-height', `${placement.height}px`);
    }

    function clearCellSelectionPreview() {
      document.querySelector('.calendar-cell-selection')?.remove();
    }

    function renderCellSelectionPreview() {
      clearCellSelectionPreview();
      if (!cellSelectionState) return;
      const gridEl = document.querySelector('#calendar-cell-grid-wrap .calendar-cell-grid');
      const placement = cellPlacementFromMinutes(
        cellSelectionState.dateKey,
        cellSelectionState.startMinutes,
        cellSelectionState.currentMinutes
      );
      if (!gridEl || !placement) return;
      const start = Math.min(cellSelectionState.startMinutes, cellSelectionState.currentMinutes);
      const end = Math.max(cellSelectionState.startMinutes, cellSelectionState.currentMinutes);
      gridEl.insertAdjacentHTML('beforeend', `
        <div class="calendar-cell-selection" style="--cell-selection-left:${placement.left}px;--cell-selection-top:${placement.top}px;--cell-selection-width:${placement.width}px;--cell-selection-height:${placement.height}px">
          <span>${escapeHtml(formatCellTime(cellDateAtMinutes(cellSelectionState.dateKey, start)))}</span>
          <strong>${escapeHtml(formatCellDuration({ start: cellDateAtMinutes(cellSelectionState.dateKey, start), end: cellDateAtMinutes(cellSelectionState.dateKey, end) }))}</strong>
        </div>
      `);
    }

    function renderCellNowIndicator(days, startHour, endHour) {
      document.querySelector('.calendar-cell-now')?.remove();
      const gridEl = document.querySelector('#calendar-cell-grid-wrap .calendar-cell-grid');
      if (!gridEl) return;
      const now = new Date();
      const todayKey = cellDayKey(now);
      if (!days.some(day => cellDayKey(day) === todayKey)) return;
      const minutes = cellMinutesForDate(now);
      if (minutes < startHour * 60 || minutes > endHour * 60) return;
      const position = cellPositionForMinute(todayKey, minutes);
      if (!position) return;
      gridEl.insertAdjacentHTML('beforeend', `
        <div class="calendar-cell-now" style="--cell-now-left:${position.left}px;--cell-now-top:${position.top}px;--cell-now-width:${position.width}px">
          <span>${escapeHtml(formatCellTime(now))}</span>
        </div>
      `);
    }

    function cellEventMinutesOnDay(event, dateKey) {
      const start = event.start && cellDayKey(event.start) === dateKey
        ? cellMinutesForDate(event.start)
        : timeStrToMinutes(slotMin);
      const endDate = eventEndDate(event);
      const end = cellDayKey(endDate) === dateKey
        ? cellMinutesForDate(endDate)
        : timeStrToMinutes(slotMax);
      return {
        start: clampCellMinutes(start),
        end: clampCellMinutes(end <= start ? timeStrToMinutes(slotMax) : end)
      };
    }

    async function saveCellEventDates(eventId, startDate, endDate) {
      const res = await fetch(`/api/events/${encodeURIComponent(eventId)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fecha_inicio: startDate.toISOString(),
          fecha_fin: endDate.toISOString()
        })
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data?.error || 'Error actualizando fechas');
      }
      calendar.refetchEvents();
    }

    function beginCellSelection(event, slot) {
      if (event.button !== 0) return;
      if (event.target.closest('.calendar-cell-chip, button, input, select, textarea')) return;
      const point = cellPointerDateTime(event, slot.dataset.cellDate);
      if (!point) return;
      event.preventDefault();
      openMoodDateKey = null;
      const maxMinutes = timeStrToMinutes(slotMax);
      cellSelectionState = {
        pointerId: event.pointerId,
        dateKey: point.dateKey,
        startMinutes: point.minutes,
        currentMinutes: Math.min(maxMinutes, point.minutes + 60),
        moved: false
      };
      slot.setPointerCapture?.(event.pointerId);
      renderCellSelectionPreview();
    }

    function beginCellResize(event, chip, edge) {
      if (event.button !== 0) return;
      const calendarEvent = calendar?.getEventById(chip.dataset.eventId);
      if (!calendarEvent?.start) return;
      const dateKey = cellDayKey(calendarEvent.start);
      const minutes = cellEventMinutesOnDay(calendarEvent, dateKey);
      event.preventDefault();
      event.stopPropagation();
      cellResizeState = {
        pointerId: event.pointerId,
        eventId: calendarEvent.id,
        dateKey,
        edge,
        startMinutes: minutes.start,
        endMinutes: minutes.end,
        previewStartMinutes: minutes.start,
        previewEndMinutes: minutes.end,
        chip
      };
      chip.classList.add('is-resizing');
      chip.setPointerCapture?.(event.pointerId);
    }

    function handleCellPointerMove(event) {
      if (cellSelectionState) {
        const point = cellPointerDateTime(event, cellSelectionState.dateKey);
        if (!point) return;
        const nextMinutes = point.minutes;
        cellSelectionState.moved = cellSelectionState.moved
          || Math.abs(nextMinutes - cellSelectionState.startMinutes) >= cellInteractionStepMinutes;
        cellSelectionState.currentMinutes = nextMinutes;
        renderCellSelectionPreview();
        return;
      }

      if (cellResizeState) {
        const point = cellPointerDateTime(event, cellResizeState.dateKey);
        if (!point) return;
        if (cellResizeState.edge === 'start') {
          cellResizeState.previewStartMinutes = Math.min(
            point.minutes,
            cellResizeState.previewEndMinutes - cellInteractionStepMinutes
          );
        } else {
          cellResizeState.previewEndMinutes = Math.max(
            point.minutes,
            cellResizeState.previewStartMinutes + cellInteractionStepMinutes
          );
        }
        const placement = cellPlacementFromMinutes(
          cellResizeState.dateKey,
          cellResizeState.previewStartMinutes,
          cellResizeState.previewEndMinutes
        );
        applyCellPlacement(cellResizeState.chip, placement);
        const timeLabel = cellResizeState.chip.querySelector('span');
        if (timeLabel) {
          timeLabel.textContent = formatCellTime(cellDateAtMinutes(cellResizeState.dateKey, cellResizeState.previewStartMinutes));
        }
      }
    }

    async function finishCellPointerInteraction(event) {
      if (cellSelectionState) {
        const state = cellSelectionState;
        cellSelectionState = null;
        clearCellSelectionPreview();
        const startMinutes = Math.min(state.startMinutes, state.currentMinutes);
        let endMinutes = Math.max(state.startMinutes, state.currentMinutes);
        if (!state.moved || endMinutes <= startMinutes) {
          endMinutes = Math.min(timeStrToMinutes(slotMax), startMinutes + 60);
        }
        openModal('new', {
          start: cellDateAtMinutes(state.dateKey, startMinutes).toISOString(),
          end: cellDateAtMinutes(state.dateKey, endMinutes).toISOString(),
          tipo_evento: 'tarea',
          capa_tiempo: 'productivo'
        });
        return;
      }

      if (cellResizeState) {
        const state = cellResizeState;
        cellResizeState = null;
        state.chip?.classList.remove('is-resizing');
        try {
          await saveCellEventDates(
            state.eventId,
            cellDateAtMinutes(state.dateKey, state.previewStartMinutes),
            cellDateAtMinutes(state.dateKey, state.previewEndMinutes)
          );
        } catch (err) {
          console.error(err);
          alert('No se pudo actualizar la duracion.');
          renderCellView();
        }
      }
    }

    function cancelCellPointerInteraction() {
      cellSelectionState = null;
      clearCellSelectionPreview();
      if (cellResizeState?.chip) {
        cellResizeState.chip.classList.remove('is-resizing');
      }
      cellResizeState = null;
      if (cellModeActive) renderCellView();
    }

    function eventToEditData(event) {
      return {
        id: event.id,
        title: event.title,
        start: event.start?.toISOString(),
        end: event.end?.toISOString(),
        extendedProps: event.extendedProps || {},
        descripcion: event.extendedProps?.descripcion || '',
        tipo_evento: event.extendedProps?.tipo_evento || '',
        capa_tiempo: eventTimeLayer(event)
      };
    }

    function eventOverlapsDay(event, day) {
      if (!event.start) return false;
      const dayStart = cloneDate(day);
      dayStart.setHours(0, 0, 0, 0);
      const dayEnd = cellAddDays(dayStart, 1);
      return event.start < dayEnd && eventEndDate(event) > dayStart;
    }

    function eventsForCellDay(events, day) {
      return events
        .filter(event => eventOverlapsDay(event, day))
        .sort((a, b) => a.start - b.start);
    }

    function renderCellChip(event, placement = null) {
      const tipo = escapeHtml(eventType(event));
      const layer = eventTimeLayer(event);
      const time = formatCellTime(event.start);
      const selectedClass = selectedCellEventId === event.id ? ' is-selected' : '';
      const blockClass = placement ? ' is-duration-block' : '';
      const placementStyle = placement
        ? ` style="--cell-event-left:${placement.left}px;--cell-event-top:${placement.top}px;--cell-event-width:${placement.width}px;--cell-event-height:${placement.height}px;"`
        : '';
      return `
        <button type="button" class="calendar-cell-chip${selectedClass}${blockClass}" data-event-id="${escapeHtml(event.id)}" data-tipo="${tipo}" data-capa="${escapeHtml(layer)}" title="${escapeHtml(timeLayerLabel(layer))} · ${escapeHtml(event.title)}"${placementStyle}>
          ${placement ? '<i class="calendar-cell-resize-handle is-start" data-resize-edge="start" aria-hidden="true"></i>' : ''}
          <span>${escapeHtml(time)}</span>
          <strong>${escapeHtml(event.title || '(Sin titulo)')}</strong>
          ${placement ? '<i class="calendar-cell-resize-handle is-end" data-resize-edge="end" aria-hidden="true"></i>' : ''}
        </button>
      `;
    }

    function renderCellEventLayer(events, days, startHour, endHour) {
      const gridEl = document.querySelector('#calendar-cell-grid-wrap .calendar-cell-grid');
      if (!gridEl) return;
      const eventBlocks = [];

      days.forEach(day => {
        const laneEnds = [];
        const placements = events
          .map(event => ({ event, placement: cellEventBlockPlacement(event, day, startHour, endHour, gridEl) }))
          .filter(item => item.placement)
          .sort((a, b) => a.placement.renderStartMs - b.placement.renderStartMs || b.placement.renderEndMs - a.placement.renderEndMs);

        placements.forEach(({ event, placement }) => {
          let lane = laneEnds.findIndex(endMs => endMs <= placement.renderStartMs);
          if (lane === -1) lane = laneEnds.length;
          laneEnds[lane] = placement.renderEndMs;
          placement.lane = 0;
          eventBlocks.push(renderCellChip(event, placement));
        });
      });

      if (eventBlocks.length) {
        gridEl.insertAdjacentHTML('beforeend', `<div class="calendar-cell-event-layer">${eventBlocks.join('')}</div>`);
      }
    }

    function renderDailySummary(events, days) {
      const summaryEl = document.getElementById('calendar-cell-daily-summary');
      if (!summaryEl) return;
      const dayFormatter = new Intl.DateTimeFormat('es-ES', { weekday: 'short', day: '2-digit' });
      const cells = days.map(day => {
        const dateKey = cellDayKey(day);
        const dayEvents = eventsForCellDay(events, day);
        const layerMinutes = dayEvents.reduce((acc, event) => {
          if (!event.start || event.allDay) return acc;
          const range = cellEventMinutesOnDay(event, dateKey);
          const minutes = Math.max(0, range.end - range.start);
          const layer = eventTimeLayer(event);
          acc[layer] = (acc[layer] || 0) + minutes;
          return acc;
        }, {});
        const productiveMinutes = layerMinutes.productivo || 0;
        const nonProductiveMinutes = Object.entries(layerMinutes)
          .filter(([layer]) => layer !== 'productivo')
          .reduce((sum, [, minutes]) => sum + minutes, 0);
        const layerLabel = Object.entries(layerMinutes)
          .filter(([, minutes]) => minutes > 0)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 3)
          .map(([layer, minutes]) => `${timeLayerLabel(layer).slice(0, 3)} ${formatMinutesCompact(minutes)}`)
          .join(' · ') || 'sin capas';
        const explicitDayLoad = dayEvents.reduce((value, event) => (
          value || firstMetricValue(event.extendedProps?.raw || {}, ['carga_dia', 'carga', 'load'], '')
        ), '');
        const dayLoad = explicitDayLoad || loadLabelFromProductiveMinutes(productiveMinutes);
        const dayFocus = dayFocusFromTimeLayers(dayEvents, dateKey);
        const sleepLabel = daySleepLabel(events, day);
        const moodLabel = dayMoodLabel(day);
        const weatherText = dayWeatherSummary(day).replace(/<[^>]*>/g, '');
        return `
          <div class="calendar-cell-day-summary" title="${escapeHtml(`${dayFormatter.format(day)} | Prod ${formatMinutesCompact(productiveMinutes)} | Otros ${formatMinutesCompact(nonProductiveMinutes)} | ${layerLabel}`)}">
            <div class="calendar-summary-head">
              <span>${escapeHtml(dayFormatter.format(day))}</span>
              <em>${dayEvents.length} ev</em>
            </div>
            <div class="calendar-summary-main">
              <strong>Prod ${escapeHtml(formatMinutesCompact(productiveMinutes))}</strong>
              <small>Otros ${escapeHtml(formatMinutesCompact(nonProductiveMinutes))}</small>
            </div>
            ${renderSummaryLayerBar(layerMinutes)}
            <div class="calendar-summary-indicators">
              ${renderSummaryDots('Carga', dayLoad, 'load')}
              ${renderSummaryDots('Foco', dayFocus, 'focus')}
            </div>
            <div class="calendar-summary-chips">
              <span class="calendar-summary-chip" title="${escapeHtml(`Sueno: ${sleepLabel}`)}"><b>${escapeHtml(sleepLabel)}</b></span>
              <span class="calendar-summary-chip" title="${escapeHtml(`Animo: ${moodLabel}`)}">${dayMoodFace(day)}</span>
              <span class="calendar-summary-chip" title="${escapeHtml(weatherText)}">${dayWeatherChip(day)}</span>
            </div>
          </div>
        `;
      }).join('');
      summaryEl.innerHTML = `
        <div class="calendar-cell-day-summary-label">Resumen</div>
        <div class="calendar-cell-day-summary-list">${cells}</div>
      `;
    }

    function weekVisibleEvents(events, days) {
      if (!days.length) return [];
      const weekEnd = cellAddDays(days[days.length - 1], 1);
      return events.filter(event => {
        const end = eventEndDate(event);
        return event.start && event.start < weekEnd && end >= days[0];
      });
    }

    function dayLayerMinutesForAssistant(events, day) {
      const dateKey = cellDayKey(day);
      return eventsForCellDay(events, day).reduce((acc, event) => {
        if (!event.start || event.allDay) return acc;
        const range = cellEventMinutesOnDay(event, dateKey);
        const minutes = Math.max(0, range.end - range.start);
        if (!minutes) return acc;
        const layer = eventTimeLayer(event);
        acc[layer] = (acc[layer] || 0) + minutes;
        return acc;
      }, {});
    }

    function weekLayerMinutesForAssistant(visibleEvents, days) {
      return visibleEvents.reduce((acc, event) => {
        if (!event.start || event.allDay) return acc;
        days.forEach(day => {
          if (!eventOverlapsDay(event, day)) return;
          const range = cellEventMinutesOnDay(event, cellDayKey(day));
          const minutes = Math.max(0, range.end - range.start);
          if (!minutes) return;
          const layer = eventTimeLayer(event);
          acc[layer] = (acc[layer] || 0) + minutes;
        });
        return acc;
      }, {});
    }

    function totalLayerMinutes(layerMinutes, layers = null) {
      return Object.entries(layerMinutes).reduce((sum, [layer, minutes]) => {
        if (layers && !layers.includes(layer)) return sum;
        return sum + minutes;
      }, 0);
    }

    function eventVisibleMinutesForAssistant(event, days) {
      if (!event.start || event.allDay) return 0;
      return days.reduce((sum, day) => {
        if (!eventOverlapsDay(event, day)) return sum;
        const range = cellEventMinutesOnDay(event, cellDayKey(day));
        return sum + Math.max(0, range.end - range.start);
      }, 0);
    }

    function weekRangeShort(days) {
      if (!days.length) return '';
      const formatter = new Intl.DateTimeFormat('es-ES', { day: '2-digit', month: 'short' });
      return `${formatter.format(days[0])} - ${formatter.format(days[days.length - 1])}`;
    }

    function sleepHoursForDay(day) {
      const value = sleepMetricsByDate[cellDayKey(day)]?.sleep_hours;
      if (value === undefined || value === null || value === '') return null;
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric : null;
    }

    function buildWeeklyAssistantDraft(events, days, layerMinutes, visibleEvents) {
      const dayFormatter = new Intl.DateTimeFormat('es-ES', { weekday: 'short' });
      const dailyStats = days.map(day => {
        const layers = dayLayerMinutesForAssistant(events, day);
        return {
          date: cellDayKey(day),
          label: dayFormatter.format(day),
          productive: layers.productivo || 0,
          total: totalLayerMinutes(layers),
          recovery: totalLayerMinutes(layers, ['salud', 'sueno', 'ocio', 'social'])
        };
      });
      const maxProductiveDay = dailyStats.reduce((best, item) => (
        item.productive > best.productive ? item : best
      ), dailyStats[0] || { label: 'dia', productive: 0, total: 0, recovery: 0 });
      const lightDay = dailyStats.reduce((best, item) => (
        item.productive < best.productive ? item : best
      ), dailyStats[0] || { label: 'dia', productive: 0, total: 0, recovery: 0 });
      const productiveTotal = layerMinutes.productivo || 0;
      const recoveryTotal = totalLayerMinutes(layerMinutes, ['salud', 'sueno', 'ocio', 'social']);
      const focusBlocks = visibleEvents.filter(event => (
        eventTimeLayer(event) === 'productivo' && eventVisibleMinutesForAssistant(event, days) >= 60
      )).length;
      const sleepValues = days
        .map(day => sleepHoursForDay(day))
        .filter(value => value !== null);
      const missingSleepDays = days.length - sleepValues.length;
      const sleepSpread = sleepValues.length
        ? Math.max(...sleepValues) - Math.min(...sleepValues)
        : 0;
      const weatherStats = days.map(day => {
        const metric = dayWeatherMetric(day);
        return {
          date: cellDayKey(day),
          label: dayFormatter.format(day),
          min: weatherTempNumber(metric.weather_temp_min_c),
          max: weatherTempNumber(metric.weather_temp_max_c),
          mean: weatherTempNumber(metric.weather_temp_mean_c),
          heat: weatherHeatLevel(metric)
        };
      });
      const weatherWithTemp = weatherStats.filter(item => item.max !== null || item.mean !== null);
      const hottestWeather = weatherWithTemp.reduce((best, item) => {
        const itemValue = item.max ?? item.mean ?? -Infinity;
        const bestValue = best ? (best.max ?? best.mean ?? -Infinity) : -Infinity;
        return itemValue > bestValue ? item : best;
      }, null);
      const hottestValue = hottestWeather ? (hottestWeather.max ?? hottestWeather.mean) : null;
      const heatRisk = hottestValue === null
        ? 'unknown'
        : hottestValue >= 35 ? 'extreme' : hottestValue >= 30 ? 'hot' : hottestValue >= 27 ? 'warm' : 'normal';

      let loadTone = 'good';
      let loadValue = 'Baja';
      let loadDetail = `${formatMinutesCompact(productiveTotal)} productivas`;
      if (productiveTotal >= 28 * 60 || maxProductiveDay.productive >= 7 * 60) {
        loadTone = 'warn';
        loadValue = 'Alta';
        loadDetail = `${maxProductiveDay.label} concentra ${formatMinutesCompact(maxProductiveDay.productive)}`;
      } else if (productiveTotal >= 18 * 60) {
        loadTone = 'accent';
        loadValue = 'Media';
        loadDetail = `${formatMinutesCompact(productiveTotal)} productivas`;
      }

      const focusTone = focusBlocks >= 3 ? 'good' : focusBlocks >= 1 ? 'accent' : 'warn';
      const focusValue = focusBlocks >= 3 ? 'Protegido' : focusBlocks >= 1 ? 'Fragil' : 'Sin bloques';
      const focusDetail = `${focusBlocks} bloques de 60m+`;

      let sleepTone = 'good';
      let sleepValue = 'Estable';
      let sleepDetail = sleepValues.length
        ? `${sleepValues.length}/7 dias registrados`
        : 'sin registro semanal';
      if (!sleepValues.length || missingSleepDays >= 3) {
        sleepTone = 'warn';
        sleepValue = 'Incompleto';
      } else if (sleepSpread >= 1.5) {
        sleepTone = 'warn';
        sleepValue = 'Irregular';
        sleepDetail = `${sleepSpread.toFixed(1)}h de variacion`;
      }

      let primaryInsight = {
        title: 'Semana con base estable',
        detail: 'La agenda tiene capas diferenciadas y permite separar trabajo, salud, ocio y mantenimiento.',
        evidence: `${visibleEvents.length} eventos visibles, ${formatMinutesCompact(productiveTotal)} productivas.`,
        impact: 'medio',
        confidence: 'media',
        tone: 'good'
      };
      if (heatRisk === 'extreme' || heatRisk === 'hot') {
        primaryInsight = {
          title: heatRisk === 'extreme' ? 'Calor extremo en la semana' : 'Calor alto en la semana',
          detail: 'La temperatura maxima puede afectar energia, foco y tolerancia a la carga. Conviene proteger el trabajo exigente fuera del pico de calor.',
          evidence: `${hottestWeather.label} llega a ${formatWeatherTemp(hottestValue)} max.`,
          weather_heat: {
            max_c: hottestValue,
            min_c: hottestWeather.min,
            risk: heatRisk
          },
          impact: heatRisk === 'extreme' ? 'alto' : 'medio',
          confidence: 'alta',
          tone: 'warn'
        };
      } else if (loadTone === 'warn') {
        primaryInsight = {
          title: 'Riesgo de saturacion',
          detail: 'La carga productiva aparece concentrada. Conviene mover o proteger bloques antes de que la semana se cierre.',
          evidence: `${maxProductiveDay.label} tiene ${formatMinutesCompact(maxProductiveDay.productive)} productivas.`,
          impact: 'alto',
          confidence: 'media',
          tone: 'warn'
        };
      } else if (focusBlocks < 2) {
        primaryInsight = {
          title: 'Foco poco protegido',
          detail: 'Hay trabajo previsto, pero faltan bloques largos donde la agenda defienda concentracion real.',
          evidence: `${focusBlocks} bloques productivos de al menos una hora.`,
          impact: 'medio',
          confidence: 'media',
          tone: 'accent'
        };
      } else if (missingSleepDays >= 3) {
        primaryInsight = {
          title: 'Sueno sin contexto suficiente',
          detail: 'La lectura de carga y recuperacion queda coja si faltan varios dias de sueno.',
          evidence: `${missingSleepDays} dias sin horas de sueno registradas.`,
          impact: 'medio',
          confidence: 'alta',
          tone: 'warn'
        };
      }

      const actions = [];
      if (heatRisk === 'extreme' || heatRisk === 'hot') {
        actions.push({
          id: 'protect_heat_window',
          title: 'Evitar pico de calor',
          detail: 'Mover foco o esfuerzo intenso a una franja mas fresca.',
          reason: `${hottestWeather.label} alcanza ${formatWeatherTemp(hottestValue)} de maxima.`,
          tool: 'calendar.reschedule_event',
          requiresConfirmation: true,
          tone: 'warn'
        });
      }
      if (loadTone === 'warn') {
        actions.push({
          id: 'rebalance_load',
          title: 'Rebalancear carga',
          detail: `Mover 60-90 min desde ${maxProductiveDay.label} hacia ${lightDay.label}.`,
          reason: `${maxProductiveDay.label} acumula ${formatMinutesCompact(maxProductiveDay.productive)} productivas.`,
          tool: 'calendar.reschedule_event',
          requiresConfirmation: true,
          tone: 'warn'
        });
      }
      if (focusBlocks < 3) {
        actions.push({
          id: 'create_focus_block',
          title: 'Reservar foco',
          detail: 'Crear un bloque de 90 min sin reuniones ni mantenimiento.',
          reason: `${focusBlocks} bloques largos detectados esta semana.`,
          tool: 'calendar.create_event',
          requiresConfirmation: true,
          tone: 'accent'
        });
      }
      if (missingSleepDays > 0) {
        actions.push({
          id: 'complete_sleep',
          title: 'Completar sueno',
          detail: 'Rellenar las horas pendientes para mejorar la lectura de carga.',
          reason: `${missingSleepDays} dias sin registro manual o de dispositivo.`,
          tool: 'daily_metrics.upsert_sleep',
          requiresConfirmation: true,
          tone: 'warn'
        });
      }
      if (recoveryTotal < Math.max(120, productiveTotal * 0.16)) {
        actions.push({
          id: 'protect_recovery',
          title: 'Reservar recuperacion',
          detail: 'Anadir una franja corta de salud, descanso u ocio real.',
          reason: `${formatMinutesCompact(recoveryTotal)} en capas de recuperacion.`,
          tool: 'calendar.create_event',
          requiresConfirmation: true,
          tone: 'good'
        });
      }
      actions.push({
        id: 'review_week_priority',
        title: 'Elegir prioridad',
        detail: 'Marcar la accion critica que debe sobrevivir aunque el dia se tuerza.',
        reason: 'El MCP necesita prioridad real para ordenar consejos.',
        tool: 'weekly_planning.set_priority',
        requiresConfirmation: true,
        tone: 'accent'
      });

      const opportunities = [
        recoveryTotal
          ? {
              title: 'Usar recuperacion como dato',
              detail: `${formatMinutesCompact(recoveryTotal)} ya separados de lo productivo.`,
              layer: 'recuperacion',
              confidence: 'media'
            }
          : {
              title: 'Planificar ocio real',
              detail: 'No hay ocio o recuperacion visible en la semana.',

    async function deleteCalendarEvent(eventId, options = {}) {
      const id = String(eventId || '').trim();
      if (!id) return false;
      if (!confirm('Eliminar este evento?')) return false;

      try {
        const res = await fetch(`/api/events/${encodeURIComponent(id)}`, { method: 'DELETE' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data?.deleted) throw new Error(data?.error || 'Error eliminando');
        selectedCellEventId = null;
        calendar?.getEventById(id)?.remove();
        if (options.closeModal) closeModal();
        calendar?.refetchEvents();
        if (cellModeActive) renderCellView();
        return true;
      } catch (err) {
        console.error(err);
        alert('No se pudo eliminar el evento.');
        return false;
      }
    }

    function selectCellEvent(eventId) {
      selectedCellEventId = eventId;
      renderCellView();

    function renderCellView() {
      if (!calendar) return;
      const gridWrap = document.getElementById('calendar-cell-grid-wrap');
      if (!gridWrap) return;
      const cellView = document.getElementById('calendar-cell-view');
      cellView?.classList.toggle('has-open-mood', Boolean(openMoodDateKey));

      const startHour = timeStrToMinutes(slotMin) / 60;
      const endHour = timeStrToMinutes(slotMax) / 60;
      const weekStart = cellStartOfWeek(calendar.getDate());
      const days = Array.from({ length: 7 }, (_, index) => cellAddDays(weekStart, index));
      const events = calendar.getEvents();
      const dayFormatter = new Intl.DateTimeFormat('es-ES', { weekday: 'short', day: '2-digit', month: 'short' });
      const today = new Date();
      const parts = [`<div class="calendar-cell-grid" role="grid" style="--calendar-cell-hour-height:${cellHourHeight}px">`];

      parts.push('<div class="calendar-cell-head calendar-cell-time-head">Hora</div>');
      days.forEach(day => {
        const isToday = sameDay(day, today) ? ' is-today' : '';
        parts.push(`<div class="calendar-cell-head calendar-cell-day-head${isToday}">${escapeHtml(dayFormatter.format(day))}</div>`);
      });

      parts.push('<div class="calendar-cell-time calendar-cell-sleep-head">Sueño</div>');
      days.forEach(day => {
        const sleepDateKey = cellDayKey(day);
        const sleepInputId = `calendar-sleep-${sleepDateKey}`;
        parts.push(`
          <div class="calendar-cell-slot calendar-cell-sleep-row" data-sleep-cell="${escapeHtml(sleepDateKey)}">
            <label for="${escapeHtml(sleepInputId)}">Horas</label>
            <input
              id="${escapeHtml(sleepInputId)}"
              class="calendar-cell-sleep-input"
              type="number"
              min="0"
              max="24"
              step="0.25"
              inputmode="decimal"
              value="${escapeHtml(sleepInputValue(day))}"
              placeholder="--"
              data-sleep-date="${escapeHtml(sleepDateKey)}"
              aria-label="Horas de sueno ${escapeHtml(sleepDateKey)}"
            >
            <span class="calendar-cell-sleep-status" data-sleep-status="${escapeHtml(sleepDateKey)}">${escapeHtml(sleepStatusLabel(day))}</span>
          </div>
        `);
      });

      parts.push('<div class="calendar-cell-time calendar-cell-mood-head">Animo</div>');
      days.forEach(day => {
        const moodDateKey = cellDayKey(day);
        const moodScore = dayMoodScore(day);
        const isOpen = openMoodDateKey === moodDateKey;
        parts.push(`
          <div class="calendar-cell-slot calendar-cell-mood-row${isOpen ? ' is-open' : ''}" data-mood-cell="${escapeHtml(moodDateKey)}">
            <button type="button" class="calendar-cell-mood-trigger" data-mood-date="${escapeHtml(moodDateKey)}" aria-haspopup="listbox" aria-expanded="${isOpen ? 'true' : 'false'}">
              <span>${dayMoodFace(day)}</span>
              <strong>${escapeHtml(dayMoodLabel(day))}</strong>
            </button>
            <div class="calendar-cell-mood-popover" role="listbox" aria-label="Seleccionar animo">
              ${renderMoodOptions(moodDateKey, moodScore)}
            </div>
          </div>
        `);
      });

      parts.push('<div class="calendar-cell-time calendar-cell-weather-head">Tiempo</div>');
      days.forEach(day => {
        const weatherDateKey = cellDayKey(day);
        parts.push(`
          <div class="calendar-cell-slot calendar-cell-weather-row" data-weather-cell="${escapeHtml(weatherDateKey)}">
            ${renderWeatherCell(day)}
          </div>
        `);
      });

      for (let hour = startHour; hour < endHour; hour += 1) {
        const safeHour = Math.floor(hour);
        const rowTone = Math.round(hour - startHour) % 2 === 0 ? ' is-row-even' : ' is-row-odd';
        parts.push(`<div class="calendar-cell-time${rowTone}">${pad2(safeHour)}:00</div>`);
        days.forEach(day => {
          const slotStart = cloneDate(day);
          slotStart.setHours(safeHour, 0, 0, 0);
          const slotEnd = cloneDate(day);
          slotEnd.setHours(safeHour + 1, 0, 0, 0);
          const isToday = sameDay(day, today) ? ' is-today' : '';
          parts.push(`
            <div class="calendar-cell-slot${isToday}${rowTone}" data-start="${slotStart.toISOString()}" data-end="${slotEnd.toISOString()}" data-cell-date="${escapeHtml(cellDayKey(day))}" data-cell-hour="${pad2(safeHour)}">
            </div>
          `);
        });
      }

      parts.push('</div>');
      gridWrap.innerHTML = parts.join('');
      renderCellEventLayer(events, days, startHour, endHour);
      renderCellNowIndicator(days, startHour, endHour);
      loadSleepMetricsForDays(days);
      renderDailySummary(events, days);
      renderCellPanel(events, days);

      gridWrap.querySelectorAll('.calendar-cell-sleep-input').forEach(input => {
        let lastValue = input.value;
        input.addEventListener('click', event => event.stopPropagation());
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') {
            event.preventDefault();
            input.blur();
          }
          event.stopPropagation();
        });
        input.addEventListener('change', () => {
          if (input.value === lastValue) return;
          lastValue = input.value;
          saveSleepHours(input.dataset.sleepDate, input.value, input);
        });
      });

      gridWrap.querySelectorAll('.calendar-cell-mood-trigger').forEach(trigger => {
        trigger.addEventListener('click', event => {
          event.stopPropagation();
          const dateKey = trigger.dataset.moodDate;
          openMoodDateKey = openMoodDateKey === dateKey ? null : dateKey;
          renderCellView();
        });
      });

      gridWrap.querySelectorAll('.calendar-cell-mood-option').forEach(option => {
        option.addEventListener('click', event => {
          event.stopPropagation();
          saveMoodScore(option.dataset.moodDate, option.dataset.moodScore, option);
        });
      });

      gridWrap.querySelectorAll('.calendar-cell-slot[data-start]').forEach(slot => {
        slot.addEventListener('pointerdown', (event) => beginCellSelection(event, slot));
      });

      gridWrap.onpointermove = handleCellPointerMove;
      gridWrap.onpointerup = finishCellPointerInteraction;
      gridWrap.onpointercancel = cancelCellPointerInteraction;
      gridWrap.onpointerleave = event => {
        if (cellSelectionState || cellResizeState) handleCellPointerMove(event);
      };

      gridWrap.querySelectorAll('.calendar-cell-chip').forEach(chip => {
        chip.querySelectorAll('.calendar-cell-resize-handle').forEach(handle => {
          handle.addEventListener('pointerdown', (event) => beginCellResize(event, chip, handle.dataset.resizeEdge));
        });
        chip.addEventListener('click', (event) => {
          if (cellResizeState || event.target.closest('.calendar-cell-resize-handle')) return;
          event.stopPropagation();
          selectCellEvent(chip.dataset.eventId);
        });
        chip.addEventListener('dblclick', (event) => {
          event.stopPropagation();
          const calendarEvent = calendar.getEventById(chip.dataset.eventId);
          if (calendarEvent) openModal('edit', eventToEditData(calendarEvent));
        });
      });
    }

    function setCellMode(active) {
      const container = document.getElementById('calendar-container');
      const calendarEl = document.getElementById('calendar');
      cellModeActive = active;
      container?.classList.toggle('is-cell-mode', active);
      if (active) {
        calendarEl?.querySelectorAll('.fc-dayGridMonth-button, .fc-timeGridWeek-button, .fc-timeGridDay-button, .fc-listWeek-button')
          .forEach(button => button.classList.remove('fc-button-active'));
      }
      const cellButton = calendarEl?.querySelector('.fc-cellView-button');
      cellButton?.classList.toggle('fc-button-active', active);
      cellButton?.setAttribute('aria-pressed', active ? 'true' : 'false');

      if (cellNowTimer) {
        clearInterval(cellNowTimer);
        cellNowTimer = null;
      }
      if (active) {
        renderCellView();
        cellNowTimer = setInterval(() => {
          if (cellModeActive) renderCellView();
        }, 60000);
      } else if (calendar) {
        cancelCellPointerInteraction();
        calendar.updateSize();
      }
    }

            const res = await fetch(url);
            if (!res.ok) throw new Error('Error al cargar eventos');
            const data = await res.json();

            const mapped = data.map(e => ({
              id: e._id,
              title: e.titulo || '(Sin título)',

              end: e.fecha_fin || e.end,

                carga_mental: e.carga_mental || '',
                carga_fisica: e.carga_fisica || '',
                raw: e
              }
            }));

          await quickUpdateDates(resizeInfo);

          if (tipo) info.el.dataset.tipo = tipo;
          info.el.dataset.capa = eventTimeLayer(info.event);

        openModal('new', { start: now.toISOString(), end: in1h.toISOString() });
      });
      btnToday?.addEventListener('click', () => calendar.today());

      // Guardar (crear/actualizar)
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = inputId.value.trim();
        const selectedLayer = inputCapa.value || inferTimeLayer(inputTipo.value, inputTitulo.value, inputDescripcion.value);
        const payload = {
          titulo: inputTitulo.value.trim(),
          descripcion: inputDescripcion.value.trim(),
          tipo_evento: inputTipo.value.trim() || null,
          fecha_inicio: localInputValueToISO(inputInicio.value),
          fecha_fin: localInputValueToISO(inputFin.value),
          // Referencia unificada (reemplaza id_objetivo / id_tarea)
          referencia_id: null,
          referencia_tipo: null,
          ...timeLayerPayload(selectedLayer)
        };
        
        // Establecer la referencia según el tipo seleccionado
        const asociarTipo = inputAsociarTipo.value;
        const asociarId = inputAsociarId.value;
        if (asociarId && (asociarTipo === 'tarea' || asociarTipo === 'objetivo')) {
          payload.referencia_id = asociarId;
          payload.referencia_tipo = asociarTipo;
        }

        if (!payload.titulo) {
          alert('El título es obligatorio.');
          return;
        }
        if (!payload.fecha_inicio || !payload.fecha_fin) {
          alert('Las fechas de inicio y fin son obligatorias.');
          return;
        }
        if (new Date(payload.fecha_fin) <= new Date(payload.fecha_inicio)) {
          alert('La fecha/hora de fin debe ser posterior al inicio.');
          return;
        }

        try {
          let res;
          if (id) {
            // UPDATE
            res = await fetch(`/api/events/${encodeURIComponent(id)}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
          } else {
            // CREATE
            res = await fetch('/api/events', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
          }
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data?.error || 'Error guardando el evento');
          }
          closeModal();
          // Recargar fuente de datos
          calendar.refetchEvents();
        } catch (err) {
          console.error(err);
          alert('No se pudo guardar el evento.');
        }
      });

      // Eliminar
      btnDelete.addEventListener('click', async () => {
        const id = inputId.value.trim();
        if (!id) return;
        if (!confirm('¿Eliminar este evento?')) return;
        try {
          const res = await fetch(`/api/events/${encodeURIComponent(id)}`, { method: 'DELETE' });
          const data = await res.json();
          if (!res.ok || !data?.deleted) throw new Error('Error eliminando');
          closeModal();
          calendar.refetchEvents();
        } catch (err) {
          console.error(err);
          alert('No se pudo eliminar el evento.');
        }
      });

      // Actualización rápida tras drag/resize
      async function quickUpdateDates(info) {
        const ev = info.event;
        const payload = {
          fecha_inicio: ev.start?.toISOString(),
          fecha_fin: (ev.end ? ev.end : new Date(ev.start.getTime() + 30 * 60 * 1000)).toISOString()
        };
        try {
          const res = await fetch(`/api/events/${encodeURIComponent(ev.id)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) {
            info.revert(); // volver al estado previo
            const data = await res.json().catch(() => ({}));
            throw new Error(data?.error || 'Error actualizando fechas');
          }
        } catch (err) {
          console.error(err);
          alert('No se pudieron actualizar las fechas del evento.');
        }
      }
    });

    window.addEventListener('resize', () => {
      if (!calendar) return;
      const h = calcContentHeight(slotMin, slotMax, 120);
      calendar.setOption('contentHeight', h);
      if (cellModeActive) renderCellView();
    });
  </script>
</body>
</html>
