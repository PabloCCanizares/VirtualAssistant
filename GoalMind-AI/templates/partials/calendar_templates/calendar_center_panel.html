
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Calendario de eventos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  

  <!-- FullCalendar 6 (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales-all.global.min.js"></script>

  <!-- Tus estilos -->
  <link rel="stylesheet" href="/static/css/calendar.css">
  
  <style>
    /* Estilos para el campo Asociar a */
    .association-field {
      position: relative;
    }
    
    .association-input-wrapper {
      position: relative;
    }
    
    .association-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 280px;
      overflow-y: auto;
      background: linear-gradient(135deg, rgba(16,24,43,.98), rgba(11,15,26,.95));
      border: 1px solid rgba(108,243,255,.25);
      border-radius: 8px;
      margin-top: 4px;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    
    .association-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.2s ease;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    
    .association-item:last-child {
      border-bottom: none;
    }
    
    .association-item:hover {
      background: rgba(108,243,255,.1);
    }
    
    .association-item-type {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }
    
    .association-item-type.tarea {
      background: rgba(55,225,143,.15);
      color: #37e18f;
      border: 1px solid rgba(55,225,143,.3);
    }
    
    .association-item-type.objetivo {
      background: rgba(139,123,255,.15);
      color: #8b7bff;
      border: 1px solid rgba(139,123,255,.3);
    }
    
    .association-item-title {
      flex: 1;
      font-size: 13px;
      color: var(--text, #e8edf5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .association-selected {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    
    .association-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .association-badge.tarea {
      background: rgba(55,225,143,.15);
      color: #37e18f;
      border: 1px solid rgba(55,225,143,.3);
    }
    
    .association-badge.objetivo {
      background: rgba(139,123,255,.15);
      color: #8b7bff;
      border: 1px solid rgba(139,123,255,.3);
    }
    
    .association-clear {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(255,107,136,.2);
      color: #ff6b88;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    
    .association-clear:hover {
      background: rgba(255,107,136,.35);
    }
    
    .association-no-results {
      padding: 14px;
      text-align: center;
      color: rgba(159,176,215,.6);
      font-size: 13px;
    }
    
    .association-loading {
      padding: 14px;
      text-align: center;
      color: rgba(108,243,255,.7);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="calendar-container">
    <div class="toolbar">
      <span class="badge">Calendario</span>
      <button id="btn-today" class="btn">Hoy</button>
      <button id="btn-new" class="btn primary">+ Nuevo evento</button>
    </div>
    <div id="calendar"></div>
    <section id="calendar-cell-view" class="calendar-cell-view" aria-label="Vista Cell compacta">
      <div class="calendar-cell-main">
        <div class="calendar-cell-grid-wrap" id="calendar-cell-grid-wrap"></div>
        <div class="calendar-cell-daily-summary" id="calendar-cell-daily-summary" aria-label="Resumen diario"></div>
      </div>
      <aside class="calendar-cell-panel" aria-live="polite">
        <div id="calendar-cell-panel-content"></div>
      </aside>
    </section>
  </div>

  <!-- Modal Crear/Editar -->
  <div class="modal-backdrop" id="eventModalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Nuevo evento</h3>
      <form id="eventForm">
        <input type="hidden" id="eventId">
        <div class="field">
          <label for="titulo">Título *</label>
          <input type="text" id="titulo" required placeholder="p. ej., Reunión con equipo">
        </div>
        <div class="field">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" placeholder="Notas, agenda, enlaces…"></textarea>
        </div>
        <div class="field">
          <label for="tipo_evento">Tipo</label>
          <select id="tipo_evento">
            <option value="">(sin tipo)</option>
            <option value="reunion">Reunión</option>
            <option value="tarea">Tarea</option>
            <option value="recordatorio">Recordatorio</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="field">
          <label for="fecha_inicio">Inicio *</label>
          <input type="datetime-local" id="fecha_inicio" required>
        </div>
        <div class="field">
          <label for="fecha_fin">Fin *</label>
          <input type="datetime-local" id="fecha_fin" required>
        </div>

        <div class="field association-field">
          <label for="asociar_a">Asociar a</label>
          <div class="association-input-wrapper">
            <input type="text" id="asociar_a" placeholder="Buscar tarea u objetivo..." autocomplete="off">
            <input type="hidden" id="asociar_tipo" value="">
            <input type="hidden" id="asociar_id" value="">
            <div class="association-results" id="associationResults" style="display: none;">
              <!-- Los resultados se cargan dinámicamente -->
            </div>
          </div>
          <div class="association-selected" id="associationSelected" style="display: none;">
            <span class="association-badge" id="associationBadge"></span>
            <button type="button" class="association-clear" id="clearAssociation" title="Quitar asociación">&times;</button>
          </div>
        </div>

        <div class="actions">
          <button type="button" id="btn-cancel" class="btn ghost">Cancelar</button>
          <button type="button" id="btn-delete" class="btn danger" style="display:none">Eliminar</button>
          <button type="submit" class="btn primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ---------- Utilidades de fecha ----------
    // Convierte ISO (UTC o con offset) -> valor válido para input datetime-local (en hora local)
    function isoToLocalInputValue(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const pad = n => String(n).padStart(2, "0");
      const yyyy = d.getFullYear();
      const mm = pad(d.getMonth() + 1);
      const dd = pad(d.getDate());
      const hh = pad(d.getHours());
      const mi = pad(d.getMinutes());
      return `${yyyy}-${mm}-${dd}T${hh}:${mi}`;
    }
    // Convierte valor de <input type="datetime-local"> -> ISO (toISOString())
    function localInputValueToISO(val) {
      if (!val) return null;
      // Interpretado en zona local por el navegador
      const d = new Date(val);
      return d.toISOString();
    }

    // ---------- Modal ----------
    const modalBackdrop = document.getElementById('eventModalBackdrop');
    const form = document.getElementById('eventForm');
    const inputId = document.getElementById('eventId');
    const inputTitulo = document.getElementById('titulo');
    const inputDescripcion = document.getElementById('descripcion');
    const inputTipo = document.getElementById('tipo_evento');
    const inputInicio = document.getElementById('fecha_inicio');
    const inputFin = document.getElementById('fecha_fin');
    const btnDelete = document.getElementById('btn-delete');
    const btnCancel = document.getElementById('btn-cancel');
    const btnNew = document.getElementById('btn-new');
    const btnToday = document.getElementById('btn-today');
    const modalTitle = document.getElementById('modalTitle');
    
    // Campos para asociación
    const inputAsociar = document.getElementById('asociar_a');
    const inputAsociarTipo = document.getElementById('asociar_tipo');
    const inputAsociarId = document.getElementById('asociar_id');
    const associationResults = document.getElementById('associationResults');
    const associationSelected = document.getElementById('associationSelected');
    const associationBadge = document.getElementById('associationBadge');
    const clearAssociationBtn = document.getElementById('clearAssociation');
    
    let searchTimeout = null;

    // ---------- Funciones de asociación ----------
    async function searchAssociations(query) {
      if (!query || query.length < 2) {
        associationResults.style.display = 'none';
        return;
      }
      
      associationResults.innerHTML = '<div class="association-loading">Buscando...</div>';
      associationResults.style.display = 'block';
      
      try {
        const res = await fetch(`/api/search/associations?q=${encodeURIComponent(query)}&limit=10`);
        if (!res.ok) throw new Error('Error en búsqueda');
        const data = await res.json();
        
        if (data.length === 0) {
          associationResults.innerHTML = '<div class="association-no-results">No se encontraron resultados</div>';
          return;
        }
        
        let html = '';
        data.forEach(item => {
          const tipoLabel = item.tipo === 'tarea' ? 'Tarea' : 'Objetivo';
          html += `
            <div class="association-item" data-id="${item._id}" data-tipo="${item.tipo}" data-titulo="${item.titulo}">
              <span class="association-item-type ${item.tipo}">${tipoLabel}</span>
              <span class="association-item-title">${item.titulo}</span>
            </div>
          `;
        });
        associationResults.innerHTML = html;
        
        // Agregar event listeners a los items
        associationResults.querySelectorAll('.association-item').forEach(item => {
          item.addEventListener('click', () => {
            selectAssociation(item.dataset.id, item.dataset.tipo, item.dataset.titulo);
          });
        });
      } catch (err) {
        console.error(err);
        associationResults.innerHTML = '<div class="association-no-results">Error al buscar</div>';
      }
    }
    
    function selectAssociation(id, tipo, titulo) {
      inputAsociarId.value = id;
      inputAsociarTipo.value = tipo;
      inputAsociar.value = '';
      inputAsociar.style.display = 'none';
      associationResults.style.display = 'none';
      
      const tipoLabel = tipo === 'tarea' ? 'Tarea' : 'Objetivo';
      associationBadge.className = `association-badge ${tipo}`;
      associationBadge.textContent = `[${tipoLabel}] ${titulo}`;
      associationSelected.style.display = 'flex';
    }
    
    function clearAssociation() {
      inputAsociarId.value = '';
      inputAsociarTipo.value = '';
      inputAsociar.value = '';
      inputAsociar.style.display = 'block';
      associationSelected.style.display = 'none';
      associationResults.style.display = 'none';
    }
    
    // Event listeners para el campo de asociación
    inputAsociar.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();
      searchTimeout = setTimeout(() => searchAssociations(query), 300);
    });
    
    inputAsociar.addEventListener('focus', () => {
      if (inputAsociar.value.trim().length >= 2) {
        searchAssociations(inputAsociar.value.trim());
      }
    });
    
    clearAssociationBtn.addEventListener('click', clearAssociation);
    
    // Cerrar resultados al hacer clic fuera
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.association-field')) {
        associationResults.style.display = 'none';
      }
    });

    function openModal(mode, data = {}) {
      modalTitle.textContent = mode === 'edit' ? 'Editar evento' : 'Nuevo evento';
      inputId.value = data._id || data.id || '';
      inputTitulo.value = data.titulo || data.title || '';
      inputDescripcion.value = data.descripcion || data.extendedProps?.descripcion || '';
      inputTipo.value = data.tipo_evento || data.extendedProps?.tipo_evento || '';
      inputInicio.value = isoToLocalInputValue(data.fecha_inicio || data.start);
      inputFin.value = isoToLocalInputValue(data.fecha_fin || data.end);
      btnDelete.style.display = mode === 'edit' ? 'inline-block' : 'none';
      
      // Limpiar y configurar asociación
      clearAssociation();
      
      // Si es edición y hay asociación previa, mostrarla
      const rawData = data.extendedProps?.raw || data;
      if (rawData.referencia_id && rawData.referencia_tipo) {
        // Nuevo formato unificado
        loadAssociationInfo(rawData.referencia_id, rawData.referencia_tipo);
      } else if (rawData.id_tarea) {
        // Compatibilidad con datos antiguos
        loadAssociationInfo(rawData.id_tarea, 'tarea');
      } else if (rawData.id_objetivo) {
        // Compatibilidad con datos antiguos
        loadAssociationInfo(rawData.id_objetivo, 'objetivo');
      }
      
      modalBackdrop.style.display = 'flex';
    }
    
    async function loadAssociationInfo(id, tipo) {
      // Mostrar la asociación existente
      inputAsociarId.value = id;
      inputAsociarTipo.value = tipo;
      inputAsociar.style.display = 'none';
      
      const tipoLabel = tipo === 'tarea' ? 'Tarea' : 'Objetivo';
      associationBadge.className = `association-badge ${tipo}`;
      associationBadge.textContent = `[${tipoLabel}] Cargando...`;
      associationSelected.style.display = 'flex';
      
      // Intentar obtener el título real (opcional, para mejor UX)
      try {
        const endpoint = tipo === 'tarea' ? `/tasks/search?id=${id}` : `/goals/${id}`;
        const res = await fetch(endpoint);
        if (res.ok) {
          const data = await res.json();
          const titulo = tipo === 'tarea' ? (data.contenido || 'Sin título') : (data.titulo || 'Sin título');
          associationBadge.textContent = `[${tipoLabel}] ${titulo}`;
        }
      } catch (err) {
        // Si falla, mantener el texto genérico
        associationBadge.textContent = `[${tipoLabel}] (ID: ${id.substring(0, 8)}...)`;
      }
    }
    function closeModal() {
      modalBackdrop.style.display = 'none';
      form.reset();
      inputId.value = '';
    }

    btnCancel.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeModal();
    });

    function timeStrToMinutes(t){ // "07:00:00" -> 420
    if(!t) return 0;
      const parts = t.split(':').map(Number);
      return parts[0]*60 + (parts[1]||0);
    }

    function getHourPixelHeight(){
      // lee la variable CSS --hour-h de tu contenedor (fallback 48)
      const el = document.querySelector('#calendar-container') || document.documentElement;
      const v = getComputedStyle(el).getPropertyValue('--hour-h');
      const px = parseFloat(v);
      return isNaN(px) ? 48 : px;
    }

    function calcContentHeight(slotMinTime, slotMaxTime, extraPx = 120){
      // extraPx: espacio para header/toolbar/col-headers; ajústalo si necesitas
      const minutes = timeStrToMinutes(slotMaxTime) - timeStrToMinutes(slotMinTime);
      const hours = Math.max(1, minutes / 60);
      return Math.round(hours * getHourPixelHeight() + extraPx);
    }

    function updateCalendarSize(newMin, newMax){
      const h = calcContentHeight(newMin, newMax, 120);
      calendar.setOption('contentHeight', h);
      calendar.setOption('slotMinTime', newMin);
      calendar.setOption('slotMaxTime', newMax);
    }

    /* --- inicialización del calendario --- */
    const slotMin = '07:00:00'; // o lee de donde lo tengas
    const slotMax = '24:00:00';
    const initialContentHeight = calcContentHeight(slotMin, slotMax, 120);
    let calendar = null;
    let cellModeActive = false;
    let selectedCellEventId = null;

    function pad2(value) {
      return String(value).padStart(2, '0');
    }

    function cloneDate(date) {
      return new Date(date.getTime());
    }

    function cellAddDays(date, days) {
      const next = cloneDate(date);
      next.setDate(next.getDate() + days);
      return next;
    }

    function cellStartOfWeek(date) {
      const start = cloneDate(date);
      start.setHours(0, 0, 0, 0);
      const mondayOffset = (start.getDay() + 6) % 7;
      start.setDate(start.getDate() - mondayOffset);
      return start;
    }

    function sameDay(a, b) {
      return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function eventEndDate(event) {
      if (event.end) return event.end;
      return new Date(event.start.getTime() + 30 * 60 * 1000);
    }

    function eventType(event) {
      return event.extendedProps?.tipo_evento || 'otro';
    }

    function formatCellTime(date) {
      return `${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
    }

    function formatCellDuration(event) {
      const end = eventEndDate(event);
      const minutes = Math.max(15, Math.round((end - event.start) / 60000));
      if (minutes < 60) return `${minutes}m`;
      const hours = Math.floor(minutes / 60);
      const rest = minutes % 60;
      return rest ? `${hours}h ${rest}m` : `${hours}h`;
    }

    function formatCellDateLong(date) {
      return new Intl.DateTimeFormat('es-ES', {
        weekday: 'long',
        day: '2-digit',
        month: 'long'
      }).format(date);
    }

    function formatCellRange(event) {
      if (event.allDay) return 'Todo el dia';
      return `${formatCellTime(event.start)} - ${formatCellTime(eventEndDate(event))}`;
    }

    function firstMetricValue(source, keys, fallback = 'Pendiente') {
      for (const key of keys) {
        const value = source?.[key];
        if (value !== undefined && value !== null && String(value).trim() !== '') {
          return String(value);
        }
      }
      return fallback;
    }

    function eventLoadLabel(event) {
      const raw = event.extendedProps?.raw || {};
      return firstMetricValue(raw, ['carga', 'carga_llm', 'load', 'workload']);
    }

    function eventFocusLabel(event) {
      const raw = event.extendedProps?.raw || {};
      return firstMetricValue(raw, ['foco', 'foco_llm', 'focus', 'focus_mode']);
    }

    function dayMetricValue(events, day, keys, fallback = 'Pend.') {
      const dayEvents = eventsForCellDay(events, day);
      for (const event of dayEvents) {
        const value = firstMetricValue(event.extendedProps?.raw || {}, keys, '');
        if (value) return value;
      }
      return fallback;
    }

    function formatSleepLabel(value) {
      const text = String(value || '').trim();
      if (!text || text.toLowerCase().startsWith('pend')) return 'Pend.';
      const normalized = text.replace(',', '.').replace(/[^\d.]/g, '');
      const hoursValue = Number(normalized);
      if (Number.isFinite(hoursValue) && normalized) {
        const hours = Math.floor(hoursValue);
        const minutes = Math.round((hoursValue - hours) * 60);
        return minutes ? `${hours}h ${minutes}m` : `${hours}h`;
      }
      return text;
    }

    function daySleepLabel(events, day) {
      const value = dayMetricValue(events, day, [
        'horas_sueno',
        'sueno_horas',
        'sleep_hours',
        'sleep_duration',
        'sleep',
        'descanso'
      ]);
      return formatSleepLabel(value);
    }

    function isAllDayOnDate(event, day) {
      if (!event.allDay) return false;
      const eventStart = cloneDate(event.start);
      const eventEnd = event.end ? cloneDate(event.end) : cellAddDays(eventStart, 1);
      eventStart.setHours(0, 0, 0, 0);
      eventEnd.setHours(0, 0, 0, 0);
      const dayStart = cloneDate(day);
      dayStart.setHours(0, 0, 0, 0);
      const dayEnd = cellAddDays(dayStart, 1);
      return eventStart < dayEnd && eventEnd > dayStart;
    }

    function shouldShowEventInSlot(event, slotStart, slotEnd, visibleStartHour) {
      if (!event.start || event.allDay) return false;
      if (!sameDay(event.start, slotStart)) return false;
      const startsInsideSlot = event.start >= slotStart && event.start < slotEnd;
      const startsBeforeVisibleRange = event.start < slotStart
        && slotStart.getHours() === visibleStartHour
        && eventEndDate(event) > slotStart;
      return startsInsideSlot || startsBeforeVisibleRange;
    }

    function eventToEditData(event) {
      return {
        id: event.id,
        title: event.title,
        start: event.start?.toISOString(),
        end: event.end?.toISOString(),
        extendedProps: event.extendedProps || {},
        descripcion: event.extendedProps?.descripcion || '',
        tipo_evento: event.extendedProps?.tipo_evento || ''
      };
    }

    function eventOverlapsDay(event, day) {
      if (!event.start) return false;
      const dayStart = cloneDate(day);
      dayStart.setHours(0, 0, 0, 0);
      const dayEnd = cellAddDays(dayStart, 1);
      return event.start < dayEnd && eventEndDate(event) > dayStart;
    }

    function eventsForCellDay(events, day) {
      return events
        .filter(event => eventOverlapsDay(event, day))
        .sort((a, b) => a.start - b.start);
    }

    function renderCellChip(event, allDay = false) {
      const tipo = escapeHtml(eventType(event));
      const time = allDay ? 'Dia' : formatCellTime(event.start);
      const duration = allDay ? '' : ` ${formatCellDuration(event)}`;
      const selectedClass = selectedCellEventId === event.id ? ' is-selected' : '';
      return `
        <button type="button" class="calendar-cell-chip${selectedClass}" data-event-id="${escapeHtml(event.id)}" data-tipo="${tipo}" title="${escapeHtml(event.title)}">
          <span>${escapeHtml(time)}</span>
          <strong>${escapeHtml(event.title || '(Sin titulo)')}</strong>
          ${duration ? `<em>${escapeHtml(duration)}</em>` : ''}
        </button>
      `;
    }

    function renderDailySummary(events, days) {
      const summaryEl = document.getElementById('calendar-cell-daily-summary');
      if (!summaryEl) return;
      const dayFormatter = new Intl.DateTimeFormat('es-ES', { weekday: 'short', day: '2-digit' });
      const cells = days.map(day => {
        const dayEvents = eventsForCellDay(events, day);
        const busyMinutes = dayEvents.reduce((sum, event) => {
          if (!event.start || event.allDay) return sum;
          return sum + Math.max(15, Math.round((eventEndDate(event) - event.start) / 60000));
        }, 0);
        const hours = Math.floor(busyMinutes / 60);
        const minutes = busyMinutes % 60;
        const timeLabel = busyMinutes ? `${hours}h${minutes ? ` ${minutes}m` : ''}` : '0h';
        const firstEvent = dayEvents.find(event => !event.allDay);
        const dayLoad = firstMetricValue(dayEvents[0]?.extendedProps?.raw || {}, ['carga_dia', 'carga', 'load'], 'Pend.');
        const dayFocus = firstMetricValue(dayEvents[0]?.extendedProps?.raw || {}, ['foco_dia', 'foco', 'focus'], 'Pend.');
        return `
          <div class="calendar-cell-day-summary">
            <span>${escapeHtml(dayFormatter.format(day))}</span>
            <strong>${dayEvents.length}</strong>
            <em>ev.</em>
            <small>${escapeHtml(timeLabel)}</small>
            <mark>${firstEvent ? escapeHtml(formatCellTime(firstEvent.start)) : 'libre'}</mark>
            <i>Carga <b>${escapeHtml(dayLoad)}</b></i>
            <i>Foco <b>${escapeHtml(dayFocus)}</b></i>
          </div>
        `;
      }).join('');
      summaryEl.innerHTML = `
        <div class="calendar-cell-day-summary-label">Resumen</div>
        <div class="calendar-cell-day-summary-list">${cells}</div>
      `;
    }

    function renderCellPanel(events, days) {
      const panelEl = document.getElementById('calendar-cell-panel-content');
      if (!panelEl) return;
      const selectedEvent = selectedCellEventId ? calendar?.getEventById(selectedCellEventId) : null;

      if (selectedEvent) {
        const raw = selectedEvent.extendedProps?.raw || {};
        const description = selectedEvent.extendedProps?.descripcion || raw.descripcion || '';
        const referenceType = raw.referencia_tipo || raw.id_tarea && 'tarea' || raw.id_objetivo && 'objetivo' || '';
        panelEl.innerHTML = `
          <div class="calendar-cell-panel-kicker">Evento</div>
          <h3>${escapeHtml(selectedEvent.title || '(Sin titulo)')}</h3>
          <div class="calendar-cell-detail">
            <div>
              <span>Cuando</span>
              <strong>${escapeHtml(formatCellRange(selectedEvent))}</strong>
            </div>
            <div>
              <span>Duracion</span>
              <strong>${escapeHtml(formatCellDuration(selectedEvent))}</strong>
            </div>
            <div>
              <span>Tipo</span>
              <strong>${escapeHtml(eventType(selectedEvent))}</strong>
            </div>
            <div>
              <span>Dia</span>
              <strong>${escapeHtml(formatCellDateLong(selectedEvent.start))}</strong>
            </div>
            <div class="calendar-cell-detail-ai">
              <span>Carga</span>
              <strong>${escapeHtml(eventLoadLabel(selectedEvent))}</strong>
            </div>
            <div class="calendar-cell-detail-ai">
              <span>Foco</span>
              <strong>${escapeHtml(eventFocusLabel(selectedEvent))}</strong>
            </div>
          </div>
          ${description ? `<p class="calendar-cell-detail-note">${escapeHtml(description)}</p>` : ''}
          ${referenceType ? `<p class="calendar-cell-detail-link">${escapeHtml(referenceType)}</p>` : ''}
          <div class="calendar-cell-panel-actions">
            <button type="button" class="calendar-cell-panel-btn" id="calendar-cell-edit-event">Editar</button>
            <button type="button" class="calendar-cell-panel-btn ghost" id="calendar-cell-clear-event">Cerrar</button>
          </div>
        `;
        document.getElementById('calendar-cell-edit-event')?.addEventListener('click', () => {
          openModal('edit', eventToEditData(selectedEvent));
        });
        document.getElementById('calendar-cell-clear-event')?.addEventListener('click', () => {
          selectedCellEventId = null;
          renderCellView();
        });
        return;
      }

      const visibleEvents = events.filter(event => {
        const end = eventEndDate(event);
        return event.start < cellAddDays(days[days.length - 1], 1) && end >= days[0];
      });
      const byType = visibleEvents.reduce((acc, event) => {
        const tipo = eventType(event);
        acc[tipo] = (acc[tipo] || 0) + 1;
        return acc;
      }, {});
      const typeRows = Object.entries(byType)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 4)
        .map(([tipo, count]) => `<span><b>${escapeHtml(count)}</b>${escapeHtml(tipo || 'otro')}</span>`)
        .join('');
      panelEl.innerHTML = `
        <div class="calendar-cell-panel-kicker">Cell</div>
        <h3>Semana compacta</h3>
        <div class="calendar-cell-summary">
          <div><b>${visibleEvents.length}</b><span>eventos</span></div>
          <div><b>${days.length}</b><span>dias</span></div>
          <div><b>IA</b><span>carga</span></div>
          <div><b>IA</b><span>foco</span></div>
          ${typeRows || '<span><b>0</b>sin eventos</span>'}
        </div>
        <p class="calendar-cell-panel-hint">Selecciona un evento para verlo aqui.</p>
      `;
    }

    function selectCellEvent(eventId) {
      selectedCellEventId = eventId;
      renderCellView();
    }

    function renderCellView() {
      if (!calendar) return;
      const gridWrap = document.getElementById('calendar-cell-grid-wrap');
      if (!gridWrap) return;

      const startHour = timeStrToMinutes(slotMin) / 60;
      const endHour = timeStrToMinutes(slotMax) / 60;
      const weekStart = cellStartOfWeek(calendar.getDate());
      const days = Array.from({ length: 7 }, (_, index) => cellAddDays(weekStart, index));
      const events = calendar.getEvents();
      const dayFormatter = new Intl.DateTimeFormat('es-ES', { weekday: 'short', day: '2-digit', month: 'short' });
      const today = new Date();
      const parts = ['<div class="calendar-cell-grid" role="grid">'];

      parts.push('<div class="calendar-cell-head calendar-cell-time-head">Hora</div>');
      days.forEach(day => {
        const isToday = sameDay(day, today) ? ' is-today' : '';
        parts.push(`<div class="calendar-cell-head calendar-cell-day-head${isToday}">${escapeHtml(dayFormatter.format(day))}</div>`);
      });

      parts.push('<div class="calendar-cell-time calendar-cell-sleep-head">Sueño</div>');
      days.forEach(day => {
        parts.push(`
          <div class="calendar-cell-slot calendar-cell-sleep-row">
            <span>Horas</span>
            <strong>${escapeHtml(daySleepLabel(events, day))}</strong>
          </div>
        `);
      });

      for (let hour = startHour; hour < endHour; hour += 1) {
        const safeHour = Math.floor(hour);
        const rowTone = Math.round(hour - startHour) % 2 === 0 ? ' is-row-even' : ' is-row-odd';
        parts.push(`<div class="calendar-cell-time${rowTone}">${pad2(safeHour)}:00</div>`);
        days.forEach(day => {
          const slotStart = cloneDate(day);
          slotStart.setHours(safeHour, 0, 0, 0);
          const slotEnd = cloneDate(day);
          slotEnd.setHours(safeHour + 1, 0, 0, 0);
          const matches = events.filter(event => shouldShowEventInSlot(event, slotStart, slotEnd, startHour));
          const visible = matches.slice(0, 4).map(event => renderCellChip(event)).join('');
          const overflow = matches.length > 4
            ? `<span class="calendar-cell-more">+${matches.length - 4}</span>`
            : '';
          const isToday = sameDay(day, today) ? ' is-today' : '';
          parts.push(`
            <div class="calendar-cell-slot${isToday}${rowTone}" data-start="${slotStart.toISOString()}" data-end="${slotEnd.toISOString()}">
              ${visible}${overflow}
            </div>
          `);
        });
      }

      parts.push('</div>');
      gridWrap.innerHTML = parts.join('');
      renderDailySummary(events, days);
      renderCellPanel(events, days);

      gridWrap.querySelectorAll('.calendar-cell-slot[data-start]').forEach(slot => {
        slot.addEventListener('click', (event) => {
          if (event.target.closest('.calendar-cell-chip')) return;
          openModal('new', { start: slot.dataset.start, end: slot.dataset.end });
        });
      });

      gridWrap.querySelectorAll('.calendar-cell-chip').forEach(chip => {
        chip.addEventListener('click', (event) => {
          event.stopPropagation();
          selectCellEvent(chip.dataset.eventId);
        });
        chip.addEventListener('dblclick', (event) => {
          event.stopPropagation();
          const calendarEvent = calendar.getEventById(chip.dataset.eventId);
          if (calendarEvent) openModal('edit', eventToEditData(calendarEvent));
        });
      });
    }

    function setCellMode(active) {
      const container = document.getElementById('calendar-container');
      const calendarEl = document.getElementById('calendar');
      cellModeActive = active;
      container?.classList.toggle('is-cell-mode', active);
      if (active) {
        calendarEl?.querySelectorAll('.fc-dayGridMonth-button, .fc-timeGridWeek-button, .fc-timeGridDay-button, .fc-listWeek-button')
          .forEach(button => button.classList.remove('fc-button-active'));
      }
      const cellButton = calendarEl?.querySelector('.fc-cellView-button');
      cellButton?.classList.toggle('fc-button-active', active);
      cellButton?.setAttribute('aria-pressed', active ? 'true' : 'false');

      if (active) {
        renderCellView();
      } else if (calendar) {
        calendar.updateSize();
      }
    }

    function wireViewButtons(calendarEl) {
      ['dayGridMonth', 'timeGridWeek', 'timeGridDay', 'listWeek'].forEach(viewName => {
        calendarEl.querySelector(`.fc-${viewName}-button`)?.addEventListener('click', () => setCellMode(false));
      });
    }

    // ---------- FullCalendar ----------
    document.addEventListener('DOMContentLoaded', function () {
      const calendarEl = document.getElementById('calendar');

      calendar = new FullCalendar.Calendar(calendarEl, {
        locale: 'es',
        timeZone: 'local',
        initialView: 'timeGridWeek',
        firstDay: 1,                 // Semana inicia en lunes
        slotMinTime: slotMin,
        slotMaxTime: slotMax,
        nowIndicator: true,
        selectable: true,
        selectMirror: true,
        editable: true,              // permite drag & drop y redimensionar
        eventResizableFromStart: true,
        customButtons: {
          cellView: {
            text: 'Cell',
            click: function () {
              calendar.changeView('timeGridWeek');
              setCellMode(true);
            }
          }
        },
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek cellView'
        },
        height: window.innerHeight,
        buttonText: {
          today: 'Hoy',
          month: 'Mes',
          week: 'Semana',
          day: 'Día',
          list: 'Lista'
        },
        // Carga de eventos desde tu API, mapeando los campos
        events: async function (info, success, failure) {
          try {
            const url = `/api/events?start=${encodeURIComponent(info.startStr)}&end=${encodeURIComponent(info.endStr)}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('Error al cargar eventos');
            const data = await res.json();

            const mapped = data.map(e => ({
              id: e._id,
              title: e.titulo || '(Sin título)',
              start: e.fecha_inicio || e.start,
              end: e.fecha_fin || e.end,
              extendedProps: {
                descripcion: e.descripcion || '',
                tipo_evento: e.tipo_evento || '',
                raw: e
              }
            }));
            success(mapped);
          } catch (err) {
            console.error(err);
            failure(err);
          }
        },

        // Crear por selección en el calendario
        select: function (selectionInfo) {
          openModal('new', {
            start: selectionInfo.startStr,
            end: selectionInfo.endStr
          });
        },

        // Editar con clic
        eventClick: function (clickInfo) {
          const ev = clickInfo.event;
          openModal('edit', {
            id: ev.id,
            title: ev.title,
            start: ev.start?.toISOString(),
            end: ev.end?.toISOString(),
            extendedProps: ev.extendedProps || {},
            descripcion: ev.extendedProps?.descripcion || '',
            tipo_evento: ev.extendedProps?.tipo_evento || ''
          });
        },

        // Mover evento (drag & drop) -> guardar
        eventDrop: async function (changeInfo) {
          await quickUpdateDates(changeInfo);
        },

        // Redimensionar evento -> guardar
        eventResize: async function (resizeInfo) {
          await quickUpdateDates(resizeInfo);
        },

        eventDidMount: function (info) {
          const tipo = info.event.extendedProps?.tipo_evento;
          if (tipo) info.el.dataset.tipo = tipo;
        },

        datesSet: function () {
          if (cellModeActive) renderCellView();
        },

        eventsSet: function () {
          if (cellModeActive) renderCellView();
        }
      });

      calendar.render();
      wireViewButtons(calendarEl);
      setCellMode(true);

      // Botones extras
      btnNew.addEventListener('click', () => {
        const now = new Date();
        const in1h = new Date(now.getTime() + 60 * 60 * 1000);
        openModal('new', { start: now.toISOString(), end: in1h.toISOString() });
      });
      btnToday.addEventListener('click', () => calendar.today());

      // Guardar (crear/actualizar)
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = inputId.value.trim();
        const payload = {
          titulo: inputTitulo.value.trim(),
          descripcion: inputDescripcion.value.trim(),
          tipo_evento: inputTipo.value.trim() || null,
          fecha_inicio: localInputValueToISO(inputInicio.value),
          fecha_fin: localInputValueToISO(inputFin.value),
          // Referencia unificada (reemplaza id_objetivo / id_tarea)
          referencia_id: null,
          referencia_tipo: null
        };
        
        // Establecer la referencia según el tipo seleccionado
        const asociarTipo = inputAsociarTipo.value;
        const asociarId = inputAsociarId.value;
        if (asociarId && (asociarTipo === 'tarea' || asociarTipo === 'objetivo')) {
          payload.referencia_id = asociarId;
          payload.referencia_tipo = asociarTipo;
        }

        if (!payload.titulo) {
          alert('El título es obligatorio.');
          return;
        }
        if (!payload.fecha_inicio || !payload.fecha_fin) {
          alert('Las fechas de inicio y fin son obligatorias.');
          return;
        }
        if (new Date(payload.fecha_fin) <= new Date(payload.fecha_inicio)) {
          alert('La fecha/hora de fin debe ser posterior al inicio.');
          return;
        }

        try {
          let res;
          if (id) {
            // UPDATE
            res = await fetch(`/api/events/${encodeURIComponent(id)}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
          } else {
            // CREATE
            res = await fetch('/api/events', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
          }
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data?.error || 'Error guardando el evento');
          }
          closeModal();
          // Recargar fuente de datos
          calendar.refetchEvents();
        } catch (err) {
          console.error(err);
          alert('No se pudo guardar el evento.');
        }
      });

      // Eliminar
      btnDelete.addEventListener('click', async () => {
        const id = inputId.value.trim();
        if (!id) return;
        if (!confirm('¿Eliminar este evento?')) return;
        try {
          const res = await fetch(`/api/events/${encodeURIComponent(id)}`, { method: 'DELETE' });
          const data = await res.json();
          if (!res.ok || !data?.deleted) throw new Error('Error eliminando');
          closeModal();
          calendar.refetchEvents();
        } catch (err) {
          console.error(err);
          alert('No se pudo eliminar el evento.');
        }
      });

      // Actualización rápida tras drag/resize
      async function quickUpdateDates(info) {
        const ev = info.event;
        const payload = {
          fecha_inicio: ev.start?.toISOString(),
          fecha_fin: (ev.end ? ev.end : new Date(ev.start.getTime() + 30 * 60 * 1000)).toISOString()
        };
        try {
          const res = await fetch(`/api/events/${encodeURIComponent(ev.id)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) {
            info.revert(); // volver al estado previo
            const data = await res.json().catch(() => ({}));
            throw new Error(data?.error || 'Error actualizando fechas');
          }
        } catch (err) {
          console.error(err);
          alert('No se pudieron actualizar las fechas del evento.');
        }
      }
    });

    window.addEventListener('resize', () => {
      if (!calendar) return;
      const h = calcContentHeight(slotMin, slotMax, 120);
      calendar.setOption('contentHeight', h);
      if (cellModeActive) renderCellView();
    });
  </script>
</body>
</html>
