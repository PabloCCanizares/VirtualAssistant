services:
  app:
    command:
      - flask
      - --app
      - app
      - run
      - --debug
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    environment:
      - FLASK_DEBUG=1
      - MONGO_LOCAL_URI=mongodb://mongodb:27017
    volumes:
      - .:/app
      - uploads:/app/uploads
